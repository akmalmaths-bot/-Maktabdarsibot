<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>So'rovnoma va Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Firebase v10 Compat kutubxonalari -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .header-text {
            text-align: center;
            margin-bottom: 30px;
            user-select: none;
        }

        .header-text h2 {
            margin: 0 0 5px 0;
            font-size: 20px;
            cursor: pointer;
        }

        .header-text p {
            margin: 0;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #8e8e93);
        }

        .step, #adminPanel {
            display: none;
            width: 100%;
        }

        .step.active, #adminPanel.active {
            display: block;
        }

        .question {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background-color: transparent;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 12px;
            font-size: 16px;
            text-align: left;
            color: var(--tg-theme-text-color, #000);
            cursor: pointer;
            transition: 0.2s;
        }

        .input-group { margin-bottom: 15px; }
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        .submit-btn, .back-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: rgba(0, 122, 255, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-text">
        <h2 id="triggerAdmin">So'rov qoldiring</h2>
        <p>Va bizning menejerimiz siz bilan bog'lanadi</p>
    </div>

    <div id="step1" class="step active">
        <div class="question">Siz Toshkent shahrida yashaysizmi?</div>
        <button class="option-btn" onclick="selectLocation('Toshkent')">Ha, yashayman</button>
        <button class="option-btn" onclick="selectLocation('Boshqa viloyat')">Yo'q, yashamayman</button>
    </div>

    <div id="step2" class="step">
        <div class="question">Iltimos, ma'lumotlaringizni kiriting</div>
        <div class="input-group">
            <input type="text" id="fullName" placeholder="Ism va familiya" required>
        </div>
        <div class="input-group">
            <input type="tel" id="phoneNumber" placeholder="+998 90 123 45 67" required>
        </div>
        <button class="submit-btn" onclick="saveData()">Yuborish</button>
    </div>

    <div id="adminPanel">
        <div class="question">Admin Panel - Ro'yxatdan o'tganlar</div>
        <button class="back-btn" onclick="closeAdminPanel()" style="background-color: #ff3b30; margin-bottom: 15px;">Yopish</button>
        <div id="usersList">Mijozlar yuklanmoqda...</div>
    </div>
</div>

<script>
    // Siz yuborgan Firebase konfiguratsiyasi
    const firebaseConfig = {
        apiKey: "AIzaSyAkEt0HxuL62v832nMpH8D36bR28FU7dhk",
        authDomain: "maktab-darslari.firebaseapp.com",
        databaseURL: "https://maktab-darslari-default-rtdb.firebaseio.com",
        projectId: "maktab-darslari",
        storageBucket: "maktab-darslari.firebasestorage.app",
        messagingSenderId: "375361700394",
        appId: "1:375361700394:web:c7b74f29fb302e7743f953",
        measurementId: "G-8S1HF14QEH"
    };

    // Firebase'ni ishga tushirish
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const tg = window.Telegram.WebApp;
    tg.expand(); 

    let userLocation = "";
    let adminClickCount = 0;

    // Admin panelni ochish mantiqi (3 marta bosish)
    document.getElementById('triggerAdmin').addEventListener('click', () => {
        adminClickCount++;
        if (adminClickCount === 3) {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('adminPanel').classList.add('active');
            loadAdminData(); 
            adminClickCount = 0;
        }
        setTimeout(() => { adminClickCount = 0; }, 2000);
    });

    function closeAdminPanel() {
        document.getElementById('adminPanel').classList.remove('active');
        document.getElementById('step1').classList.add('active');
    }

    function selectLocation(loc) {
        userLocation = loc;
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
    }

    function saveData() {
        const fullName = document.getElementById('fullName').value.trim();
        const phoneNumber = document.getElementById('phoneNumber').value.trim();

        if (fullName === "" || phoneNumber === "") {
            tg.showAlert("Iltimos, ma'lumotlarni to'ldiring!");
            return;
        }

        const data = {
            ism: fullName,
            telefon: phoneNumber,
            manzil: userLocation,
            vaqt: firebase.firestore.FieldValue.serverTimestamp()
        };

        db.collection("mijozlar").add(data)
        .then(() => {
            tg.showAlert("Ma'lumotlaringiz muvaffaqiyatli saqlandi!");
            tg.sendData(JSON.stringify(data));
        })
        .catch((error) => {
            console.error("Xatolik: ", error);
            tg.showAlert("Xatolik yuz berdi. Qaytadan urinib ko'ring.");
        });
    }

    function loadAdminData() {
        const usersListDiv = document.getElementById('usersList');
        
        db.collection("mijozlar").orderBy("vaqt", "desc").get()
        .then((querySnapshot) => {
            let html = `<table>
                            <tr>
                                <th>Ism</th>
                                <th>Telefon</th>
                                <th>Manzil</th>
                            </tr>`;
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                html += `<tr>
                            <td>${data.ism || '-'}</td>
                            <td>${data.telefon || '-'}</td>
                            <td>${data.manzil || '-'}</td>
                         </tr>`;
            });
            html += `</table>`;
            usersListDiv.innerHTML = html;
        })
        .catch((error) => {
            usersListDiv.innerHTML = "Ma'lumotlarni yuklashda xatolik: " + error.message;
        });
    }
</script>

</body>
</html>
