<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>So'rovnoma</title>
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .header-text {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-text h2 {
            margin: 0 0 5px 0;
            font-size: 20px;
        }

        .header-text p {
            margin: 0;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #8e8e93);
        }

        /* 1-bosqich uslublari */
        .step {
            display: none;
            width: 100%;
        }

        .step.active {
            display: block;
        }

        .question {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background-color: transparent;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 12px;
            font-size: 16px;
            text-align: left;
            color: var(--tg-theme-text-color, #000);
            cursor: pointer;
            transition: 0.2s;
        }

        .option-btn:hover, .option-btn:active {
            background-color: rgba(0, 122, 255, 0.1);
            border-color: #007aff;
        }

        /* 2-bosqich uslublari */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 12px;
            font-size: 16px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            box-sizing: border-box;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #007aff;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
        
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-text">
        <h2>So'rov qoldiring</h2>
        <p>Va bizning menejerimiz siz bilan bog'lanadi</p>
    </div>

    <!-- 1-BOSQICH: Manzilni so'rash -->
    <div id="step1" class="step active">
        <div class="question">Siz Toshkent shahrida yashaysizmi?</div>
        <button class="option-btn" onclick="selectLocation('Toshkent')">Ha, yashayman</button>
        <button class="option-btn" onclick="selectLocation('Boshqa viloyat')">Yo'q, yashamayman</button>
    </div>

    <!-- 2-BOSQICH: Ma'lumotlarni kiritish -->
    <div id="step2" class="step">
        <div class="question">Iltimos, ma'lumotlaringizni kiriting</div>
        
        <div class="input-group">
            <input type="text" id="fullName" placeholder="Ism va familiya" required>
        </div>
        
        <div class="input-group">
            <input type="tel" id="phoneNumber" placeholder="+998 90 123 45 67" required>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="sendData()">Yuborish</button>
    </div>
</div>

<script>
    // Telegram Web App obyekti
    const tg = window.Telegram.WebApp;
    tg.expand(); // Oynani to'liq hajmda ochish

    let userLocation = "";

    // 1-bosqichdan 2-bosqichga o'tish
    function selectLocation(loc) {
        userLocation = loc;
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        
        // Agar Telegram nomeri va ismi bo'lsa, avtomatik to'ldirishga harakat qilish
        if (tg.initDataUnsafe?.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('fullName').value = (user.first_name || "") + " " + (user.last_name || "");
        }
    }

    // Ma'lumotlarni Telegram botga yuborish
    function sendData() {
        const fullName = document.getElementById('fullName').value.trim();
        const phoneNumber = document.getElementById('phoneNumber').value.trim();

        if (fullName === "" || phoneNumber === "") {
            tg.showAlert("Iltimos, barcha maydonlarni to'ldiring!");
            return;
        }

        // Yuboriladigan ma'lumotlar obyekti
        const data = {
            location: userLocation,
            name: fullName,
            phone: phoneNumber
        };

        // Ma'lumotlarni botga jo'natish (botdagi web_app_data handler qabul qiladi)
        tg.sendData(JSON.stringify(data));
    }
</script>

</body>
</html>
