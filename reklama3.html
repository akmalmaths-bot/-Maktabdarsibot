<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelajak O'quv Markazi</title>
    <!-- Tailwind CSS (Zamonaviy dizayn uchun) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Kvadrat shakli uchun maxsus klass */
        .aspect-square { aspect-ratio: 1 / 1; }
        /* Yashirin admin tugmasi */
        .secret-admin { position: fixed; bottom: 0; right: 0; width: 40px; height: 40px; cursor: pointer; z-index: 100; opacity: 0; }
        /* Animatsiyalar */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-gray-800 pb-10">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <button id="backBtn" onclick="goBack()" class="hidden bg-blue-700 hover:bg-blue-800 px-4 py-2 rounded-lg transition">
                <i class="fa-solid fa-arrow-left mr-2"></i> Orqaga
            </button>
            <h1 id="pageTitle" class="text-xl font-bold flex-1 text-center">Bo'limni tanlang</h1>
            <div class="w-10"></div> <!-- Balans uchun -->
        </div>
    </nav>

    <div class="max-w-4xl mx-auto p-4 mt-4">
        
        <!-- 1. BO'LIMLAR (Kategoriyalar) -->
        <div id="categoriesView" class="flex flex-col gap-4 fade-in">
            <!-- JavaScript orqali to'ldiriladi -->
        </div>

        <!-- 2. FANLAR (Kvadrat shaklida) -->
        <div id="subjectsView" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 fade-in">
            <!-- JavaScript orqali to'ldiriladi -->
        </div>

        <!-- 3. FAN HAQIDA MA'LUMOT -->
        <div id="detailView" class="hidden fade-in bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
            <h2 id="detailTitle" class="text-2xl font-bold text-center text-blue-600 mb-6 border-b pb-4">Fan Nomi</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Dars ma'lumotlari -->
                <div class="bg-blue-50 p-5 rounded-xl">
                    <h3 class="text-lg font-bold text-blue-800 mb-3"><i class="fa-solid fa-circle-info mr-2"></i> Dars ma'lumotlari</h3>
                    <ul class="space-y-3" id="courseInfo">
                        <!-- JS to'ldiradi -->
                    </ul>
                </div>

                <!-- Ustoz ma'lumotlari -->
                <div class="bg-green-50 p-5 rounded-xl">
                    <h3 class="text-lg font-bold text-green-800 mb-3"><i class="fa-solid fa-chalkboard-user mr-2"></i> Ustoz haqida</h3>
                    <ul class="space-y-3" id="teacherInfo">
                        <!-- JS to'ldiradi -->
                    </ul>
                    <!-- Sertifikat rasmi joylashuvchi qism -->
                    <div id="certificateImgContainer" class="mt-4 hidden">
                        <p class="font-bold text-sm text-gray-600 mb-2">Sertifikat/Yutuq:</p>
                        <img id="certificateImg" src="" alt="Sertifikat" class="w-full rounded-lg shadow-md border">
                    </div>
                </div>
            </div>

            <button onclick="openModal()" class="mt-8 w-full block bg-gradient-to-r from-red-500 to-pink-500 hover:from-red-600 hover:to-pink-600 text-white text-xl font-bold py-4 rounded-xl shadow-lg transform transition hover:scale-[1.02]">
                <i class="fa-regular fa-pen-to-square mr-2"></i> Ro'yxatdan o'tish
            </button>
        </div>

        <!-- 4. ADMIN PANEL -->
        <div id="adminPanel" class="hidden fade-in">
            <div class="bg-white p-6 rounded-2xl shadow-lg border border-gray-100 mb-6">
                <h2 class="text-2xl font-bold text-gray-800 border-b pb-4 mb-4"><i class="fa-solid fa-users text-blue-500 mr-2"></i> Ro'yxatdan o'tganlar</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-700">
                                <th class="p-3 border-b">Ism</th>
                                <th class="p-3 border-b">Familiya</th>
                                <th class="p-3 border-b">Sinf</th>
                                <th class="p-3 border-b">Telefon</th>
                                <th class="p-3 border-b">Fan</th>
                            </tr>
                        </thead>
                        <tbody id="studentsList" class="divide-y divide-gray-200">
                            <!-- JS to'ldiradi -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Tahrirlash Bo'limi -->
            <div class="bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
                <h2 class="text-2xl font-bold text-gray-800 border-b pb-4 mb-4"><i class="fa-solid fa-pen-to-square text-orange-500 mr-2"></i> Ma'lumotlarni tahrirlash</h2>
                
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Qaysi fanni tahrirlamoqchisiz?</label>
                    <select id="editSubjectSelect" onchange="loadSubjectDataForEdit()" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">
                        <option value="">Fanni tanlang...</option>
                        <!-- JS to'ldiradi -->
                    </select>
                </div>

                <div id="editFormFields" class="hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block font-bold text-sm mb-1">Haftada</label><input type="text" id="ed_haftada" class="w-full p-2 border rounded"></div>
                        <div><label class="block font-bold text-sm mb-1">Dars davomiyligi</label><input type="text" id="ed_davomiyligi" class="w-full p-2 border rounded"></div>
                        <div><label class="block font-bold text-sm mb-1">Oylik to'lov</label><input type="text" id="ed_tolov" class="w-full p-2 border rounded"></div>
                        <div><label class="block font-bold text-sm mb-1">Manzil</label><input type="text" id="ed_manzil" class="w-full p-2 border rounded"></div>
                        <div><label class="block font-bold text-sm mb-1">Murojaat uchun</label><input type="text" id="ed_murojaat" class="w-full p-2 border rounded"></div>
                        <div><label class="block font-bold text-sm mb-1">Ustoz Ism-familiyasi</label><input type="text" id="ed_ustoz" class="w-full p-2 border rounded"></div>
                        <div class="md:col-span-2"><label class="block font-bold text-sm mb-1">Ish tajribasi</label><input type="text" id="ed_tajriba" class="w-full p-2 border rounded"></div>
                        <div class="md:col-span-2"><label class="block font-bold text-sm mb-1">Yutuqlari (Matn)</label><textarea id="ed_yutuq" class="w-full p-2 border rounded" rows="2"></textarea></div>
                        <div class="md:col-span-2 border-t pt-4">
                            <label class="block font-bold text-sm mb-1 text-blue-600">Sertifikat / Yutuq rasmi (Ixtiyoriy)</label>
                            <input type="file" id="ed_sertifikat" accept="image/*" class="w-full p-2 border rounded" onchange="handleImageUpload(event)">
                            <p class="text-xs text-gray-500 mt-1">*Faqat rasm yuklang.</p>
                            <img id="ed_imgPreview" src="" class="hidden mt-3 h-32 object-cover rounded border">
                        </div>
                    </div>
                    <button onclick="saveSubjectEdit()" class="mt-6 w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg shadow transition">O'zgarishlarni Saqlash</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Ro'yxatdan o'tish Modali -->
    <div id="regModal" class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-[100] px-4">
        <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-2xl relative fade-in">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 text-2xl"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Ro'yxatdan o'tish</h2>
            
            <form id="regForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-bold mb-1">O'quvchining ismi</label>
                    <input type="text" id="r_ism" required oninput="checkForm()" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-1">O'quvchining familiyasi</label>
                    <input type="text" id="r_familiya" required oninput="checkForm()" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-1">O'quvchining sinfi</label>
                    <input type="text" id="r_sinf" required oninput="checkForm()" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-1">Aloqa uchun nomer</label>
                    <input type="tel" id="r_nomer" placeholder="+998" required oninput="checkForm()" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="button" id="submitBtn" disabled onclick="submitForm()" class="w-full py-4 mt-2 rounded-xl text-lg font-bold text-white bg-gray-400 cursor-not-allowed transition duration-300">
                    Tayyor
                </button>
            </form>
        </div>
    </div>

    <!-- Yashirin Admin tugmasi (O'ng burchak eng pastda) -->
    <div class="secret-admin" onclick="openAdmin()" title="Admin"></div>

    <script>
        // Dastlabki Ma'lumotlar bazasi
        const defaultData = {
            categories: {
                "Aniq fanlar": ["Matematika", "Kimyo va biologiya", "Ona tili va adabiyot", "Tarix va huquq", "Prezident maktabiga tayyorlov", "Mental arifmetika"],
                "Xorijiy tillar": ["Ingliz tili", "Rus tili", "Koreys tili", "Xitoy tili", "Nemis tili"],
                "IT va texnologiyalar": ["Robototexnika"],
                "Maktabga tayyorlov": ["Maktabga tayyorlov"],
                "Intellektual va mantiqiy": ["Shaxmat"]
            },
            subjectDetails: {}, 
            students: []
        };

        // Standart fan andozasi
        const defaultSubjectInfo = {
            haftada: "3 marta", davomiyligi: "2 soatdan", tolov: "600 000 so‘m",
            manzil: "Uchtepa tumani, 2-mavze, baraka market yonida",
            murojaat: "+99897 140 28 86", ustoz: "Kiritilmagan", tajriba: "Kiritilmagan", yutuq: "Kiritilmagan", sertifikat: ""
        };

        let db = JSON.parse(localStorage.getItem('kelajak_db')) || defaultData;
        let currentSubject = "";
        let currentUploadedImageBase64 = ""; // Rasm bazasi

        function init() {
            const catView = document.getElementById('categoriesView');
            catView.innerHTML = "";
            for (const cat in db.categories) {
                catView.innerHTML += `
                    <div onclick="showSubjects('${cat}')" class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white p-6 rounded-xl shadow-md cursor-pointer hover:shadow-xl transform hover:-translate-y-1 transition duration-300 flex items-center justify-between">
                        <span class="text-xl font-bold">${cat}</span>
                        <i class="fa-solid fa-chevron-right opacity-70"></i>
                    </div>`;
            }

            // Admin select uchun barcha fanlarni yig'ish
            const select = document.getElementById('editSubjectSelect');
            select.innerHTML = '<option value="">Fanni tanlang...</option>';
            for(const cat in db.categories){
                db.categories[cat].forEach(sub => {
                    select.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            }
        }

        function showSubjects(categoryName) {
            hideAllViews();
            document.getElementById('subjectsView').classList.remove('hidden');
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('pageTitle').innerText = categoryName;

            const subView = document.getElementById('subjectsView');
            subView.innerHTML = "";
            db.categories[categoryName].forEach(sub => {
                subView.innerHTML += `
                    <div onclick="showDetail('${sub}')" class="bg-gradient-to-br from-emerald-400 to-green-500 text-white rounded-xl shadow p-4 aspect-square flex items-center justify-center text-center cursor-pointer hover:scale-105 transition duration-300">
                        <span class="font-bold text-[15px] sm:text-lg leading-tight">${sub}</span>
                    </div>`;
            });
        }

        function showDetail(subjectName) {
            currentSubject = subjectName;
            hideAllViews();
            document.getElementById('detailView').classList.remove('hidden');
            document.getElementById('pageTitle').innerText = "Fan haqida";
            document.getElementById('detailTitle').innerText = subjectName;

            let info = db.subjectDetails[subjectName] || defaultSubjectInfo;

            document.getElementById('courseInfo').innerHTML = `
                <li><span class="font-bold text-gray-700">Haftada:</span> ${info.haftada}</li>
                <li><span class="font-bold text-gray-700">Dars davomiyligi:</span> ${info.davomiyligi}</li>
                <li><span class="font-bold text-gray-700">Oylik to‘lov:</span> <span class="text-red-600 font-bold">${info.tolov}</span></li>
                <li><span class="font-bold text-gray-700">Manzil:</span> ${info.manzil}</li>
                <li><span class="font-bold text-gray-700">Murojaat uchun:</span> ${info.murojaat}</li>
            `;

            document.getElementById('teacherInfo').innerHTML = `
                <li><span class="font-bold text-gray-700">Ism-familiya:</span> ${info.ustoz}</li>
                <li><span class="font-bold text-gray-700">Ish tajribasi:</span> ${info.tajriba}</li>
                <li><span class="font-bold text-gray-700">Yutuqlari:</span> ${info.yutuq}</li>
            `;

            let imgCont = document.getElementById('certificateImgContainer');
            if (info.sertifikat && info.sertifikat !== "") {
                imgCont.classList.remove('hidden');
                document.getElementById('certificateImg').src = info.sertifikat;
            } else {
                imgCont.classList.add('hidden');
            }
        }

        function goBack() {
            if(!document.getElementById('adminPanel').classList.contains('hidden')){
                hideAllViews();
                document.getElementById('categoriesView').classList.remove('hidden');
                document.getElementById('pageTitle').innerText = "Bo'limni tanlang";
                document.getElementById('backBtn').classList.add('hidden');
            }
            else if(!document.getElementById('detailView').classList.contains('hidden')){
                hideAllViews();
                document.getElementById('subjectsView').classList.remove('hidden');
                // find category of current subject to set title (simplified here)
                document.getElementById('pageTitle').innerText = "Fanlarni tanlang";
            } else {
                hideAllViews();
                document.getElementById('categoriesView').classList.remove('hidden');
                document.getElementById('pageTitle').innerText = "Bo'limni tanlang";
                document.getElementById('backBtn').classList.add('hidden');
            }
        }

        function hideAllViews() {
            document.getElementById('categoriesView').classList.add('hidden');
            document.getElementById('subjectsView').classList.add('hidden');
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
        }

        // --- Ro'yxatdan o'tish qismi ---
        function openModal() { document.getElementById('regModal').classList.replace('hidden', 'flex'); }
        function closeModal() { document.getElementById('regModal').classList.replace('flex', 'hidden'); }

        function checkForm() {
            let i = document.getElementById('r_ism').value.trim();
            let f = document.getElementById('r_familiya').value.trim();
            let s = document.getElementById('r_sinf').value.trim();
            let n = document.getElementById('r_nomer').value.trim();
            let btn = document.getElementById('submitBtn');

            if(i && f && s && n) {
                btn.disabled = false;
                btn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                btn.classList.add('bg-green-500', 'hover:bg-green-600', 'shadow-lg');
            } else {
                btn.disabled = true;
                btn.classList.add('bg-gray-400', 'cursor-not-allowed');
                btn.classList.remove('bg-green-500', 'hover:bg-green-600', 'shadow-lg');
            }
        }

        function submitForm() {
            let student = {
                ism: document.getElementById('r_ism').value,
                fam: document.getElementById('r_familiya').value,
                sinf: document.getElementById('r_sinf').value,
                nomer: document.getElementById('r_nomer').value,
                fan: currentSubject
            };

            db.students.push(student);
            localStorage.setItem('kelajak_db', JSON.stringify(db));
            
            alert("Muvaffaqiyatli ro'yxatdan o'tdingiz!");
            closeModal();
            document.getElementById('regForm').reset();
            checkForm(); // tugmani yana ochirib qoyish
        }

        // --- ADMIN PANEL QISMI ---
        function openAdmin() {
            let pass = prompt("Admin paroli:");
            if (pass === "admin123") {
                hideAllViews();
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('backBtn').classList.remove('hidden');
                document.getElementById('pageTitle').innerText = "Admin Panel";
                
                let tbody = document.getElementById('studentsList');
                tbody.innerHTML = "";
                db.students.forEach(st => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 border-b text-sm">${st.ism}</td>
                            <td class="p-3 border-b text-sm">${st.fam}</td>
                            <td class="p-3 border-b text-sm">${st.sinf}</td>
                            <td class="p-3 border-b text-sm font-bold text-blue-600">${st.nomer}</td>
                            <td class="p-3 border-b text-sm">${st.fan}</td>
                        </tr>`;
                });
            } else { alert("Noto'g'ri parol!"); }
        }

        function loadSubjectDataForEdit() {
            let subj = document.getElementById('editSubjectSelect').value;
            let fields = document.getElementById('editFormFields');
            if(subj) {
                fields.classList.remove('hidden');
                let info = db.subjectDetails[subj] || defaultSubjectInfo;
                
                document.getElementById('ed_haftada').value = info.haftada;
                document.getElementById('ed_davomiyligi').value = info.davomiyligi;
                document.getElementById('ed_tolov').value = info.tolov;
                document.getElementById('ed_manzil').value = info.manzil;
                document.getElementById('ed_murojaat').value = info.murojaat;
                document.getElementById('ed_ustoz').value = info.ustoz;
                document.getElementById('ed_tajriba').value = info.tajriba;
                document.getElementById('ed_yutuq').value = info.yutuq;
                
                currentUploadedImageBase64 = info.sertifikat || "";
                let preview = document.getElementById('ed_imgPreview');
                if(currentUploadedImageBase64) {
                    preview.src = currentUploadedImageBase64;
                    preview.classList.remove('hidden');
                } else {
                    preview.classList.add('hidden');
                }
            } else { fields.classList.add('hidden'); }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUploadedImageBase64 = e.target.result;
                    let preview = document.getElementById('ed_imgPreview');
                    preview.src = currentUploadedImageBase64;
                    preview.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function saveSubjectEdit() {
            let subj = document.getElementById('editSubjectSelect').value;
            if(!subj) return alert("Fanni tanlang!");

            db.subjectDetails[subj] = {
                haftada: document.getElementById('ed_haftada').value,
                davomiyligi: document.getElementById('ed_davomiyligi').value,
                tolov: document.getElementById('ed_tolov').value,
                manzil: document.getElementById('ed_manzil').value,
                murojaat: document.getElementById('ed_murojaat').value,
                ustoz: document.getElementById('ed_ustoz').value,
                tajriba: document.getElementById('ed_tajriba').value,
                yutuq: document.getElementById('ed_yutuq').value,
                sertifikat: currentUploadedImageBase64
            };

            localStorage.setItem('kelajak_db', JSON.stringify(db));
            alert("Ma'lumotlar muvaffaqiyatli saqlandi!");
        }

        // Start app
        init();
    </script>
</body>
</html>
