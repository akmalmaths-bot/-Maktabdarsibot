<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Rasmli Mobil Taqdimot</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2pdf.js for exporting to PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-heading { font-family: 'Montserrat', sans-serif; }
        
        /* Editable areas */
        [contenteditable="true"] {
            outline: none;
            transition: all 0.2s ease;
            border: 1px dashed transparent;
            border-radius: 4px;
        }
        [contenteditable="true"]:focus {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* Slide sizing for 16:9 aspect ratio */
        .slide-aspect {
            width: 100%;
            aspect-ratio: 16/9;
            position: relative;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            /* For mobile, make slides stack better if needed, or maintain ratio */
            .slide-aspect { aspect-ratio: auto; height: 100%; }
        }

        /* Presentation Mode vs PDF Mode */
        .pdf-mode {
            display: flex !important;
            flex-direction: column !important;
            width: 1280px !important; /* Force desktop width for PDF */
            background: white !important;
            height: auto !important;
        }
        .pdf-mode .slide-container {
            width: 1280px !important;
            height: 720px !important;
            display: flex !important;
            position: relative !important;
            page-break-after: always;
            opacity: 1 !important;
            transform: none !important;
            margin: 0 !important;
        }
        .pdf-mode .no-print { display: none !important; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* Image Upload Overlay */
        .image-overlay {
            opacity: 0;
            transition: opacity 0.3s;
            background: rgba(0,0,0,0.5);
        }
        .img-wrapper:hover .image-overlay, .img-wrapper:active .image-overlay {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- SETTINGS PANEL -->
    <div id="settings-view" class="max-w-4xl mx-auto w-full bg-white min-h-screen md:min-h-0 md:my-10 md:rounded-3xl shadow-xl overflow-hidden transition-all duration-300">
        
        <div class="bg-gradient-to-br from-indigo-600 via-blue-600 to-sky-500 p-6 md:p-10 text-white text-center">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4 font-heading drop-shadow-md">Taqdimot Generatori 🚀</h1>
            <p class="text-blue-100 text-sm md:text-lg opacity-90">AI matn yozadi + AI mos rasm tanlaydi. Tahrirlang va PDF oling!</p>
        </div>
        
        <div id="error-box" class="hidden mx-6 mt-6 p-4 bg-red-100 text-red-700 rounded-xl border border-red-200 text-sm font-medium"></div>

        <form id="generate-form" class="p-6 md:p-10 space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">1. Ism va Familiyangiz</label>
                <input type="text" id="input-name" required placeholder="Masalan: Akmaljon Jo'raqo'ziyev" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">2. Pedagogik Mavzuni tanlang</label>
                <select id="input-topic" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer bg-white">
                    <option value="" disabled selected>-- 12 ta mavzudan birini tanlang --</option>
                    <option value="Pedagogika fanining predmetini o'rganish va ta'riflar tahlili">1. Pedagogika fanining predmetini o'rganish</option>
                    <option value="Pedagogikaning obyekti va predmeti o‘rtasidagi farq (Universitet misolida)">2. Pedagogikaning obyekti va predmeti o‘rtasidagi farq</option>
                    <option value="Pedagogikaning maqsad va vazifalari. Zamonaviy oliy ta'lim">3. Pedagogikaning maqsad va vazifalari</option>
                    <option value="Ta’lim, tarbiya, rivojlanish, shakllanish tushunchalari aloqasi">4. Ta’lim, tarbiya, rivojlanish, shakllanish</option>
                    <option value="Pedagogikaning psixologiya bilan aloqasi va yuzaga keladigan muammolar">5. Pedagogikaning psixologiya bilan aloqasi</option>
                    <option value="Pedagogikaning falsafa bilan aloqasi va ta'lim maqsadiga ta'siri">6. Pedagogikaning falsafa bilan aloqasi</option>
                    <option value="Kuzatish metodi. Universitetdagi darsni kuzatish mezonlari">7. Kuzatish metodi (Kuzatuv mezonlari)</option>
                    <option value="Samarali seminar qanday bo‘lishi kerak? Talabalar fikri">8. Samarali seminar qanday bo‘lishi kerak?</option>
                    <option value="Pedagogik eksperiment nima? Universitet uchun tajriba loyihasi">9. Pedagogik eksperiment loyihasi</option>
                    <option value="Nazariy va empirik tadqiqot metodlarini taqqoslash">10. Nazariy va empirik tadqiqot metodlari</option>
                    <option value="Pedagogik tadqiqotda ilmiy faraz (gipoteza) va unga misollar">11. Pedagogik tadqiqotda ilmiy faraz (gipoteza)</option>
                    <option value="Pedagogika boshqa fanlarsiz rivojlana oladimi? Argumentlar">12. “Pedagogika boshqa fanlarsiz rivojlana oladimi?”</option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">3. Slaydlar soni</label>
                    <select id="input-count" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="3">3 ta bet</option>
                        <option value="4" selected>4 ta bet</option>
                        <option value="5">5 ta bet</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">4. Dizayn Temasi</label>
                    <select id="input-theme" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white cursor-pointer">
                        <option value="theme-modern">Zamonaviy (Moviy)</option>
                        <option value="theme-elegant">Elegant (Qora-Tilla)</option>
                        <option value="theme-nature">Tabiat (Yashil)</option>
                        <option value="theme-creative">Kreativ (Siyohrang)</option>
                        <option value="theme-sunset">Quyosh (To'q sariq)</option>
                        <option value="theme-clean">Toza (Oq-Kulrang)</option>
                        <option value="theme-tech">Texno (Qorong'u-Ko'k)</option>
                        <option value="theme-rose">Atirgul (Pushti)</option>
                        <option value="theme-education">Ta'lim (To'q Ko'k)</option>
                        <option value="theme-minimal">Minimal (Oq-Qora)</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="btn-generate" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-transform transform active:scale-95 flex items-center justify-center gap-3 text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                <span>Slaydlarni Yaratish</span>
            </button>
            
            <div id="loader" class="hidden flex-col items-center justify-center py-6">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-200 border-t-blue-600 mb-4"></div>
                <p class="text-slate-600 font-semibold text-center">Sun'iy intellekt matn yozmoqda va rasmlar qidirmoqda... <br><span class="text-sm font-normal text-slate-400">10-15 soniya</span></p>
            </div>
        </form>
    </div>

    <!-- PRESENTATION VIEWER -->
    <div id="viewer-view" class="hidden fixed inset-0 w-full h-full flex-col z-50 bg-black transition-opacity duration-300">
        
        <!-- Toolbar -->
        <div class="absolute top-0 left-0 right-0 z-50 flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent no-print">
            <button id="btn-close" class="bg-white/10 backdrop-blur-md text-white rounded-full p-2 hover:bg-red-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            
            <div class="text-white/80 text-xs hidden md:block backdrop-blur-md bg-black/30 px-4 py-1 rounded-full pointer-events-none">
                💡 Matnlarni va rasmlarni tahrirlash uchun ustiga bosing
            </div>

            <button id="btn-pdf" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-full shadow-lg transition-all flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                PDF Yuklab olish
            </button>
        </div>

        <div class="text-white/80 text-xs md:hidden absolute top-16 left-4 right-4 text-center z-40 backdrop-blur-md bg-black/40 px-3 py-2 rounded-full pointer-events-none no-print">
            Matn yoki rasmni tahrirlash uchun ustiga bosing
        </div>

        <!-- Slides Area -->
        <div id="slides-wrapper" class="flex-1 w-full h-full relative overflow-hidden bg-slate-900 md:p-8 flex items-center justify-center">
            <div id="slides-container" class="w-full h-full relative flex items-center justify-center">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Navigation -->
        <div class="absolute bottom-4 left-0 right-0 px-4 md:px-8 flex justify-between items-center z-50 no-print">
            <button id="btn-prev" class="bg-white/10 backdrop-blur-md text-white rounded-full p-3 hover:bg-white/30 transition-all disabled:opacity-30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="flex space-x-2" id="dots-container"></div>
            <button id="btn-next" class="bg-white/10 backdrop-blur-md text-white rounded-full p-3 hover:bg-white/30 transition-all disabled:opacity-30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>
    </div>

    <script>
        // --- THEMES ---
        const themeConfig = {
            'theme-modern': { bg: 'bg-blue-50', text: 'text-slate-800', accent: 'text-blue-700', card: 'bg-white/90 backdrop-blur shadow-lg border-l-4 border-blue-600', footer: 'bg-blue-900 text-blue-100' },
            'theme-elegant': { bg: 'bg-slate-900', text: 'text-slate-100', accent: 'text-amber-400', card: 'bg-slate-800/80 backdrop-blur shadow-xl border-t border-amber-500', footer: 'bg-black text-amber-500' },
            'theme-nature': { bg: 'bg-emerald-50', text: 'text-emerald-950', accent: 'text-emerald-700', card: 'bg-white shadow-md rounded-2xl', footer: 'bg-emerald-900 text-emerald-100' },
            'theme-creative': { bg: 'bg-purple-50', text: 'text-indigo-950', accent: 'text-purple-600', card: 'bg-white/80 backdrop-blur shadow-xl rounded-xl border-2 border-purple-200', footer: 'bg-indigo-950 text-purple-200' },
            'theme-sunset': { bg: 'bg-orange-50', text: 'text-red-950', accent: 'text-orange-600', card: 'bg-white shadow border-b-4 border-orange-500', footer: 'bg-orange-950 text-orange-200' },
            'theme-clean': { bg: 'bg-gray-100', text: 'text-gray-900', accent: 'text-black', card: 'bg-white shadow-sm border border-gray-200', footer: 'bg-gray-800 text-gray-100' },
            'theme-tech': { bg: 'bg-[#0f172a]', text: 'text-cyan-50', accent: 'text-cyan-400', card: 'bg-[#1e293b] border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.1)]', footer: 'bg-black text-cyan-500' },
            'theme-rose': { bg: 'bg-rose-50', text: 'text-rose-950', accent: 'text-rose-600', card: 'bg-white shadow-md rounded-3xl border border-rose-100', footer: 'bg-rose-900 text-rose-100' },
            'theme-education': { bg: 'bg-indigo-50', text: 'text-indigo-900', accent: 'text-indigo-700', card: 'bg-white shadow-lg', footer: 'bg-indigo-900 text-indigo-100' },
            'theme-minimal': { bg: 'bg-white', text: 'text-black', accent: 'text-black', card: 'bg-white border-2 border-black rounded-none shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]', footer: 'bg-white text-black border-t-2 border-black' }
        };

        // --- ELEMENTS ---
        const settingsView = document.getElementById('settings-view');
        const viewerView = document.getElementById('viewer-view');
        const form = document.getElementById('generate-form');
        const btnGenerate = document.getElementById('btn-generate');
        const loader = document.getElementById('loader');
        const errorBox = document.getElementById('error-box');
        
        const slidesContainer = document.getElementById('slides-container');
        const dotsContainer = document.getElementById('dots-container');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnClose = document.getElementById('btn-close');
        const btnPdf = document.getElementById('btn-pdf');

        let slidesData = [];
        let currentIdx = 0;
        let selectedTheme = '';

        // --- STREAMING_CHUNK:API Call Setup... ---
        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.remove('hidden');
            btnGenerate.classList.remove('hidden');
            loader.classList.add('hidden');
            loader.classList.remove('flex');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            
            const name = document.getElementById('input-name').value.trim();
            const topic = document.getElementById('input-topic').options[document.getElementById('input-topic').selectedIndex].text;
            const count = parseInt(document.getElementById('input-count').value);
            selectedTheme = document.getElementById('input-theme').value;

            btnGenerate.classList.add('hidden');
            loader.classList.remove('hidden');
            loader.classList.add('flex');

            try {
                slidesData = await fetchSlidesData(topic, count);
                buildSlidesDOM(slidesData, selectedTheme, name);
                
                settingsView.classList.add('hidden');
                viewerView.classList.remove('hidden');
                viewerView.classList.add('flex');
            } catch (err) {
                console.error(err);
                showError("Xatolik: " + err.message + ". Iltimos qayta urinib ko'ring.");
            } finally {
                btnGenerate.classList.remove('hidden');
                loader.classList.add('hidden');
                loader.classList.remove('flex');
            }
        });

        // --- STREAMING_CHUNK:Gemini API Interaction... ---
        async function fetchSlidesData(topic, count) {
            const apiKey = ""; // API Key handled by environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            const prompt = `Siz O'zbekistonlik universitet o'qituvchisisiz. Quyidagi mavzuda talabalar uchun ${count} ta slaydlik taqdimot yarating: "${topic}".
            Javobingiz faqat JSON formatida bo'lishi kerak.
            Muhim: imagePrompt maydoni slayd mazmunini ifodalovchi qisqa INGLIZ tilidagi prompt (1-2 ta so'z birikmasi) bo'lishi shart (masalan: "university students studying", "psychology brain graphic", "teacher in modern classroom"). Bu rasmlarni avtomatik yaratish uchun ishlatiladi.
            
            JSON structure to enforce:
            [
              {
                "title": "Slayd nomi (O'zbekcha)",
                "items": [
                  { "heading": "Kichik sarlavha", "description": "1-2 gaplik izoh" }
                ],
                "source": "ZiyoNet, ilmiy jurnallar yoki kitoblar nomi",
                "imagePrompt": "English prompt for image generator"
              }
            ]`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "ARRAY",
                        items: {
                            type: "OBJECT",
                            properties: {
                                "title": { "type": "STRING" },
                                "items": {
                                    "type": "ARRAY",
                                    "items": {
                                        "type": "OBJECT",
                                        "properties": {
                                            "heading": { "type": "STRING" },
                                            "description": { "type": "STRING" }
                                        }
                                    }
                                },
                                "source": { "type": "STRING" },
                                "imagePrompt": { "type": "STRING" }
                            },
                            "required": ["title", "items", "source", "imagePrompt"]
                        }
                    }
                }
            };

            const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!res.ok) throw new Error("Tarmoq yoki API xatosi");
            const data = await res.json();
            
            if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                return JSON.parse(data.candidates[0].content.parts[0].text);
            } else {
                throw new Error("AI kutilgan formatda javob bermadi");
            }
        }

        // --- STREAMING_CHUNK:Rendering Slides & Image Handler... ---
        function getImageUrl(prompt) {
            // using a random seed to prevent caching identical prompts
            const seed = Math.floor(Math.random() * 10000);
            return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=500&nologo=true&seed=${seed}`;
        }

        function buildSlidesDOM(slides, themeKey, userName) {
            slidesContainer.innerHTML = '';
            dotsContainer.innerHTML = '';
            const t = themeConfig[themeKey];

            slides.forEach((slide, i) => {
                const slEl = document.createElement('div');
                slEl.className = `slide-container w-full h-full absolute inset-0 transition-opacity duration-300 ${t.bg} ${t.text} flex flex-col ${i === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0 hidden'}`;
                slEl.id = `sl-${i}`;

                const imgHtml = `
                    <div class="relative w-full h-48 md:h-full bg-black/10 rounded-xl overflow-hidden img-wrapper shadow-inner no-print-bg">
                        <img src="${getImageUrl(slide.imagePrompt)}" crossorigin="anonymous" class="w-full h-full object-cover target-img" alt="${slide.imagePrompt}" onerror="this.src='https://placehold.co/800x500/eeeeee/999999?text=Image+Load+Error'">
                        <div class="absolute inset-0 image-overlay flex flex-col items-center justify-center backdrop-blur-sm no-print">
                            <label class="cursor-pointer bg-white text-blue-600 font-bold px-4 py-2 md:px-6 md:py-3 rounded-full text-xs md:text-sm shadow-xl hover:scale-105 transition-transform flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 md:h-5 md:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                Boshqa rasm yuklash
                                <input type="file" accept="image/*" class="hidden" onchange="handleLocalImage(this)">
                            </label>
                        </div>
                    </div>
                `;

                if (i === 0) {
                    slEl.innerHTML = `
                        <div class="flex-1 flex flex-col md:flex-row w-full h-full overflow-y-auto overflow-x-hidden">
                            <div class="flex-1 flex flex-col justify-center p-8 md:p-16 w-full">
                                <div class="inline-block ${t.card} px-4 py-1 rounded-full text-xs md:text-sm font-bold tracking-widest uppercase mb-6 self-start" contenteditable="true">O'quv Taqdimoti</div>
                                <h1 class="text-3xl md:text-5xl font-extrabold font-heading leading-tight mb-8 ${t.accent}" contenteditable="true">${slide.title}</h1>
                                
                                <div class="space-y-4">
                                    ${slide.items.map(item => `
                                        <div class="flex items-start gap-3">
                                            <div class="mt-1.5 w-2 h-2 rounded-full ${t.accent} bg-current"></div>
                                            <div>
                                                <h3 class="font-bold font-heading text-lg" contenteditable="true">${item.heading}</h3>
                                                <p class="opacity-80 text-sm md:text-base" contenteditable="true">${item.description}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="w-full md:w-5/12 p-6 md:p-8 flex items-center">
                                ${imgHtml}
                            </div>
                        </div>
                        ${renderFooter(t, userName, slide.source, i, slides.length)}
                    `;
                } else {
                    slEl.innerHTML = `
                        <div class="flex-1 p-6 md:p-12 overflow-y-auto flex flex-col w-full h-full">
                            <h2 class="text-2xl md:text-4xl font-bold font-heading mb-6 md:mb-8 ${t.accent} w-full" contenteditable="true">${slide.title}</h2>
                            <div class="flex flex-col md:flex-row gap-6 md:gap-10 flex-1">
                                <div class="flex-1 grid grid-cols-1 gap-4 content-start w-full">
                                    ${slide.items.map((item, idx) => `
                                        <div class="p-5 ${t.card} rounded-xl">
                                            <h3 class="text-lg md:text-xl font-bold font-heading mb-2 flex items-center gap-2" contenteditable="true">
                                                <span class="${t.accent} opacity-70">${idx+1}.</span> ${item.heading}
                                            </h3>
                                            <p class="opacity-80 text-sm md:text-base" contenteditable="true">${item.description}</p>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="w-full md:w-1/3 flex-shrink-0 flex items-start">
                                    ${imgHtml}
                                </div>
                            </div>
                        </div>
                        ${renderFooter(t, userName, slide.source, i, slides.length)}
                    `;
                }
                slidesContainer.appendChild(slEl);

                // Navigation Dots
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 md:w-3 md:h-3 rounded-full transition-all ${i === 0 ? 'bg-blue-500 scale-125' : 'bg-white/40'}`;
                dot.onclick = () => showSlide(i);
                dotsContainer.appendChild(dot);
            });

            currentIdx = 0;
            updateNavUI();
        }

        function renderFooter(t, userName, source, idx, total) {
            return `
                <div class="h-12 md:h-16 px-4 md:px-8 flex items-center justify-between text-xs md:text-sm font-semibold ${t.footer} shrink-0 w-full">
                    <div class="flex items-center gap-2 md:gap-4 truncate">
                        <span class="flex items-center gap-1 opacity-90 truncate" contenteditable="true">👤 ${userName}</span>
                        <span class="opacity-50 hidden md:inline">|</span>
                        <span class="flex items-center gap-1 opacity-80 truncate" contenteditable="true">📚 ${source}</span>
                    </div>
                    <div class="bg-black/20 px-3 py-1 rounded-full shrink-0">
                        ${idx + 1} / ${total}
                    </div>
                </div>
            `;
        }

        // --- STREAMING_CHUNK:Interactions & Local Image handling... ---
        window.handleLocalImage = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = input.closest('.img-wrapper').querySelector('.target-img');
                    img.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        };

        // --- SLIDE NAVIGATION ---
        function showSlide(index) {
            if (index < 0 || index >= slidesData.length) return;
            
            const curEl = document.getElementById(`sl-${currentIdx}`);
            const tgtEl = document.getElementById(`sl-${index}`);
            
            curEl.style.opacity = '0';
            setTimeout(() => {
                curEl.classList.add('hidden');
                curEl.classList.replace('z-10', 'z-0');
            }, 300);

            dotsContainer.children[currentIdx].className = 'w-2 h-2 md:w-3 md:h-3 rounded-full transition-all bg-white/40';
            
            currentIdx = index;
            
            tgtEl.classList.remove('hidden');
            tgtEl.classList.replace('z-0', 'z-10');
            // Trigger reflow
            void tgtEl.offsetWidth; 
            tgtEl.style.opacity = '1';
            
            dotsContainer.children[currentIdx].className = 'w-2 h-2 md:w-3 md:h-3 rounded-full transition-all bg-blue-500 scale-125';
            
            updateNavUI();
        }

        function updateNavUI() {
            btnPrev.disabled = currentIdx === 0;
            btnNext.disabled = currentIdx === slidesData.length - 1;
        }

        btnPrev.onclick = () => showSlide(currentIdx - 1);
        btnNext.onclick = () => showSlide(currentIdx + 1);
        
        btnClose.onclick = () => {
            viewerView.classList.add('hidden');
            viewerView.classList.remove('flex');
            settingsView.classList.remove('hidden');
        };

        // --- STREAMING_CHUNK:PDF Export Logic... ---
        btnPdf.onclick = async () => {
            const btnHtml = btnPdf.innerHTML;
            btnPdf.innerHTML = '<div class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></div> Kutib turing...';
            btnPdf.disabled = true;

            const container = document.getElementById('slides-container');
            const allSlides = document.querySelectorAll('.slide-container');

            // Switch to PDF rendering mode
            container.classList.add('pdf-mode');
            
            allSlides.forEach(s => {
                s.classList.remove('hidden', 'absolute', 'inset-0');
                s.style.opacity = '1';
            });

            const opt = {
                margin:       0,
                filename:     'Pedagogika_Taqdimot_AI.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'px', format: [1280, 720], orientation: 'landscape' }
            };

            try {
                await html2pdf().set(opt).from(container).save();
            } catch (err) {
                console.error(err);
                alert("PDF yuklashda xatolik yuz berdi. Internetni tekshiring.");
            } finally {
                // Restore presentation mode
                container.classList.remove('pdf-mode');
                allSlides.forEach((s, idx) => {
                    s.classList.add('absolute', 'inset-0');
                    if (idx !== currentIdx) {
                        s.classList.add('hidden');
                        s.style.opacity = '0';
                    }
                });

                btnPdf.innerHTML = btnHtml;
                btnPdf.disabled = false;
            }
        };

        // Swipe support for mobile
        let touchstartX = 0;
        let touchendX = 0;
        
        viewerView.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, {passive: true});

        viewerView.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            if (touchendX < touchstartX - 50) showSlide(currentIdx + 1);
            if (touchendX > touchstartX + 50) showSlide(currentIdx - 1);
        }
    </script>
</body>
</html>
