<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Mobil Taqdimot Generatori</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2pdf.js for exporting to PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-heading { font-family: 'Montserrat', sans-serif; }
        
        /* Editable areas */
        [contenteditable="true"] {
            outline: none;
            transition: all 0.2s ease;
            border-bottom: 1px dashed transparent;
        }
        [contenteditable="true"]:focus {
            border-bottom: 1px dashed rgba(59, 130, 246, 0.5);
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Presentation Mode vs PDF Mode */
        .pdf-mode {
            display: flex !important;
            flex-direction: column !important;
            width: 1280px !important; 
            background: white !important;
            height: auto !important;
        }
        .pdf-mode .slide-container {
            width: 1280px !important;
            height: 720px !important;
            display: flex !important;
            position: relative !important;
            page-break-after: always;
            opacity: 1 !important;
            transform: none !important;
            margin: 0 !important;
        }
        .pdf-mode .no-print { display: none !important; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .img-overlay {
            opacity: 0;
            transition: opacity 0.3s;
        }
        .img-wrapper:hover .img-overlay { opacity: 1; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <!-- SETTINGS PANEL -->
    <div id="settings-view" class="max-w-2xl mx-auto w-full bg-white min-h-screen md:min-h-0 md:my-10 md:rounded-3xl shadow-2xl overflow-hidden">
        
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 md:p-8 text-white text-center">
            <h1 class="text-3xl md:text-4xl font-extrabold mb-2 font-heading">Taqdimot Generatori 🚀</h1>
            <p class="text-blue-100 text-sm">AI matn yozadi + AI mos rasm tanlaydi</p>
        </div>
        
        <!-- Error Box -->
        <div id="error-box" class="hidden mx-6 mt-6 p-4 bg-red-50 text-red-700 rounded-xl border border-red-200 text-sm font-semibold text-center"></div>

        <form id="generate-form" class="p-6 md:p-8 space-y-5">
            
            <!-- 1. Ism -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">👤 1. Ism va Familiyangiz</label>
                <input type="text" id="input-name" required placeholder="Masalan: Akmaljon Jo'raqo'ziyev" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- 2. Mavzu -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">📚 2. Pedagogik Mavzuni tanlang</label>
                <select id="input-topic" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                    <option value="Pedagogika fanining predmetini o'rganish va ta'riflar tahlili">1. Pedagogika fanining predmetini o'rganish</option>
                    <option value="Pedagogikaning obyekti va predmeti o‘rtasidagi farq (Universitet misolida)">2. Pedagogikaning obyekti va predmeti o‘rtasidagi farq</option>
                    <option value="Pedagogikaning maqsad va vazifalari. Zamonaviy oliy ta'lim">3. Pedagogikaning maqsad va vazifalari</option>
                    <option value="Ta’lim, tarbiya, rivojlanish, shakllanish tushunchalari aloqasi">4. Ta’lim, tarbiya, rivojlanish, shakllanish</option>
                    <option value="Pedagogikaning psixologiya bilan aloqasi va yuzaga keladigan muammolar">5. Pedagogikaning psixologiya bilan aloqasi</option>
                    <option value="Pedagogikaning falsafa bilan aloqasi va ta'lim maqsadiga ta'siri">6. Pedagogikaning falsafa bilan aloqasi</option>
                    <option value="Kuzatish metodi. Universitetdagi darsni kuzatish mezonlari">7. Kuzatish metodi (Kuzatuv mezonlari)</option>
                    <option value="Samarali seminar qanday bo‘lishi kerak? Talabalar fikri">8. Samarali seminar qanday bo‘lishi kerak?</option>
                    <option value="Pedagogik eksperiment nima? Universitet uchun tajriba loyihasi">9. Pedagogik eksperiment loyihasi</option>
                    <option value="Nazariy va empirik tadqiqot metodlarini taqqoslash">10. Nazariy va empirik tadqiqot metodlari</option>
                    <option value="Pedagogik tadqiqotda ilmiy faraz (gipoteza) va unga misollar">11. Pedagogik tadqiqotda ilmiy faraz (gipoteza)</option>
                    <option value="Pedagogika boshqa fanlarsiz rivojlana oladimi? Argumentlar">12. “Pedagogika boshqa fanlarsiz rivojlana oladimi?”</option>
                </select>
            </div>

            <!-- 3 & 4. Count & Theme -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">📑 3. Slaydlar soni</label>
                    <select id="input-count" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="3">3 ta bet</option>
                        <option value="4" selected>4 ta bet</option>
                        <option value="5">5 ta bet</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">🎨 4. Dizayn</label>
                    <select id="input-theme" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="t-blue">Moviy</option>
                        <option value="t-green">Yashil</option>
                        <option value="t-purple">Siyohrang</option>
                        <option value="t-dark">Qorong'u</option>
                        <option value="t-orange">Apelsin</option>
                        <option value="t-red">Qizil</option>
                        <option value="t-teal">Yalpiz</option>
                        <option value="t-indigo">Indigo</option>
                        <option value="t-pink">Pushti</option>
                        <option value="t-bw">Oq-Qora</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="btn-generate" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-transform transform active:scale-95 flex items-center justify-center gap-3 text-lg mt-4">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span>Taqdimotni Yaratish</span>
            </button>
            
            <!-- Loader -->
            <div id="loader" class="hidden flex-col items-center justify-center py-6">
                <div class="animate-spin rounded-full h-10 w-10 border-4 border-gray-200 border-t-blue-600 mb-4"></div>
                <p class="text-gray-600 font-semibold text-center text-sm">Sun'iy intellekt ishlamoqda... <br><span class="text-xs text-gray-400">10-20 soniya kutib turing</span></p>
            </div>
        </form>
    </div>

    <!-- PRESENTATION VIEWER -->
    <div id="viewer-view" class="hidden fixed inset-0 w-full h-full flex-col z-50 bg-black">
        
        <!-- Toolbar -->
        <div class="absolute top-0 left-0 right-0 z-50 flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent no-print">
            <button id="btn-close" class="bg-white/10 text-white rounded-full p-2 hover:bg-red-500">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            
            <div class="text-white/80 text-xs hidden md:block bg-black/40 px-3 py-1 rounded-full">
                💡 Tahrirlash uchun matnga, rasmni o'zgartirish uchun rasmga bosing
            </div>

            <button id="btn-pdf" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-full shadow-lg flex items-center gap-2">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                <span class="hidden md:inline">PDF qilib saqlash</span>
                <span class="md:hidden">PDF</span>
            </button>
        </div>

        <!-- Slides Wrapper -->
        <div id="slides-wrapper" class="flex-1 w-full h-full relative overflow-hidden bg-gray-900 md:p-6 flex items-center justify-center">
            <div id="slides-container" class="w-full h-full relative flex items-center justify-center">
                <!-- Slides will be injected here -->
            </div>
        </div>

        <!-- Navigation -->
        <div class="absolute bottom-16 left-0 right-0 px-4 flex justify-between items-center z-50 no-print pointer-events-none">
            <button id="btn-prev" class="bg-black/50 text-white rounded-full p-3 pointer-events-auto active:bg-gray-700 disabled:opacity-30">
                <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <button id="btn-next" class="bg-black/50 text-white rounded-full p-3 pointer-events-auto active:bg-gray-700 disabled:opacity-30">
                <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>
    </div>

    <script>
        // Themes Palette
        const themes = {
            't-blue': { bg: 'bg-blue-50', text: 'text-blue-950', accent: 'text-blue-600', card: 'bg-white border-l-4 border-blue-500', footBg: 'bg-blue-900', footText: 'text-blue-100' },
            't-green': { bg: 'bg-emerald-50', text: 'text-emerald-950', accent: 'text-emerald-600', card: 'bg-white border-l-4 border-emerald-500', footBg: 'bg-emerald-900', footText: 'text-emerald-100' },
            't-purple': { bg: 'bg-purple-50', text: 'text-purple-950', accent: 'text-purple-600', card: 'bg-white border-l-4 border-purple-500', footBg: 'bg-purple-900', footText: 'text-purple-100' },
            't-dark': { bg: 'bg-gray-900', text: 'text-gray-100', accent: 'text-blue-400', card: 'bg-gray-800 border-l-4 border-blue-500', footBg: 'bg-black', footText: 'text-gray-400' },
            't-orange': { bg: 'bg-orange-50', text: 'text-orange-950', accent: 'text-orange-600', card: 'bg-white border-l-4 border-orange-500', footBg: 'bg-orange-900', footText: 'text-orange-100' },
            't-red': { bg: 'bg-red-50', text: 'text-red-950', accent: 'text-red-600', card: 'bg-white border-l-4 border-red-500', footBg: 'bg-red-900', footText: 'text-red-100' },
            't-teal': { bg: 'bg-teal-50', text: 'text-teal-950', accent: 'text-teal-600', card: 'bg-white border-l-4 border-teal-500', footBg: 'bg-teal-900', footText: 'text-teal-100' },
            't-indigo': { bg: 'bg-indigo-50', text: 'text-indigo-950', accent: 'text-indigo-600', card: 'bg-white border-l-4 border-indigo-500', footBg: 'bg-indigo-900', footText: 'text-indigo-100' },
            't-pink': { bg: 'bg-pink-50', text: 'text-pink-950', accent: 'text-pink-600', card: 'bg-white border-l-4 border-pink-500', footBg: 'bg-pink-900', footText: 'text-pink-100' },
            't-bw': { bg: 'bg-white', text: 'text-black', accent: 'text-gray-700', card: 'bg-gray-50 border-l-4 border-black', footBg: 'bg-black', footText: 'text-white' }
        };

        // Elements
        const form = document.getElementById('generate-form');
        const errBox = document.getElementById('error-box');
        const slidesContainer = document.getElementById('slides-container');
        
        let slidesData = [];
        let currentIdx = 0;

        function showError(msg) {
            errBox.textContent = msg;
            errBox.classList.remove('hidden');
            document.getElementById('btn-generate').classList.remove('hidden');
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('loader').classList.remove('flex');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errBox.classList.add('hidden');
            
            // API Kalit dastur ichiga yashirildi (hardcoded)
            const apiKey = "AIzaSyDZZ6FmeMVA6QPc8f-P-lGKsl677XqcFpg"; 

            const name = document.getElementById('input-name').value.trim();
            const topic = document.getElementById('input-topic').options[document.getElementById('input-topic').selectedIndex].text;
            const count = document.getElementById('input-count').value;
            const themeKey = document.getElementById('input-theme').value;

            document.getElementById('btn-generate').classList.add('hidden');
            const loader = document.getElementById('loader');
            loader.classList.remove('hidden');
            loader.classList.add('flex');

            try {
                slidesData = await fetchSlidesData(apiKey, topic, count);
                buildSlidesDOM(slidesData, themeKey, name);
                
                document.getElementById('settings-view').classList.add('hidden');
                document.getElementById('viewer-view').classList.remove('hidden');
                document.getElementById('viewer-view').classList.add('flex');
            } catch (err) {
                console.error(err);
                showError("Xatolik: " + err.message);
            } finally {
                document.getElementById('btn-generate').classList.remove('hidden');
                loader.classList.add('hidden');
                loader.classList.remove('flex');
            }
        });

        // --- STREAMING_CHUNK:Gemini Fetch Logic... ---
        async function fetchSlidesData(apiKey, topic, count) {
            // Using gemini-1.5-flash as requested
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            const prompt = `Siz O'zbekistonlik pedagogika ekspertisiz. Quyidagi mavzuda talabalar uchun ${count} ta slaydlik taqdimot yarating: "${topic}".
            Faqat qat'iy JSON formatida javob bering. Hech qanday boshqa so'z qo'shmang (```json kabi backticklar ham kerak emas, to'g'ridan to'g'ri array yuboring).
            
            JSON strukturasi shunday bo'lishi shart:
            [
              {
                "title": "Slayd sarlavhasi",
                "content": ["Qisqa fakt 1", "Qisqa fakt 2", "Qisqa fakt 3"],
                "image_prompt": "English prompt for image generation related to this slide (e.g., 'university students studying in a modern library', 'abstract psychology brain illustration')"
              }
            ]`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseMimeType: "application/json"
                }
            };

            const res = await fetch(apiUrl, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify(payload) 
            });

            const data = await res.json();

            if (!res.ok) {
                let errorMsg = "Tarmoq xatosi";
                if(data.error && data.error.message) {
                    errorMsg = data.error.message;
                }
                if(res.status === 400 && errorMsg.includes("API key")) {
                    throw new Error("API Kalit noto'g'ri. Iltimos tekshiring.");
                }
                throw new Error(errorMsg);
            }
            
            if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                return JSON.parse(data.candidates[0].content.parts[0].text);
            } else {
                throw new Error("AI kutilgan formatda javob bermadi.");
            }
        }

        // --- STREAMING_CHUNK:Slide Builder & Local Image Replacement... ---
        function getImageUrl(prompt) {
            const seed = Math.floor(Math.random() * 100000);
            return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=450&nologo=true&seed=${seed}`;
        }

        window.swapImage = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Find the image sibling in the same label
                    const img = input.parentElement.querySelector('img');
                    img.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        };

        function buildSlidesDOM(slides, themeKey, userName) {
            slidesContainer.innerHTML = '';
            const t = themes[themeKey];

            slides.forEach((slide, i) => {
                const slEl = document.createElement('div');
                slEl.className = `slide-container w-full h-full absolute inset-0 transition-opacity duration-300 ${t.bg} ${t.text} flex flex-col ${i === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0 hidden'}`;
                slEl.id = `sl-${i}`;

                // Image Element with local upload feature
                const imgHtml = `
                    <label class="cursor-pointer block w-full h-48 md:h-full bg-black/10 rounded-xl overflow-hidden img-wrapper shadow-md relative group no-print-bg">
                        <img src="${getImageUrl(slide.image_prompt)}" class="w-full h-full object-cover transition-transform group-hover:scale-105" alt="AI Image" crossorigin="anonymous">
                        <div class="absolute inset-0 bg-black/50 flex items-center justify-center img-overlay no-print">
                            <span class="bg-white/90 text-blue-700 px-4 py-2 rounded-lg font-bold text-sm shadow-lg">📁 Rasm yuklash</span>
                        </div>
                        <input type="file" accept="image/*" class="hidden" onchange="swapImage(this)">
                    </label>
                `;

                // Slide Layout
                let contentHtml = '';
                if(i === 0) {
                    contentHtml = `
                        <div class="flex-1 flex flex-col md:flex-row w-full h-full p-6 md:p-12 overflow-y-auto">
                            <div class="flex-1 flex flex-col justify-center mb-6 md:mb-0 md:pr-8">
                                <h1 class="text-3xl md:text-5xl font-extrabold font-heading leading-tight mb-6 ${t.accent}" contenteditable="true">${slide.title}</h1>
                                <div class="space-y-4">
                                    ${slide.content.map(pt => `<p class="text-lg opacity-90" contenteditable="true">${pt}</p>`).join('')}
                                </div>
                            </div>
                            <div class="w-full md:w-1/2 flex items-center">
                                ${imgHtml}
                            </div>
                        </div>
                    `;
                } else {
                    contentHtml = `
                        <div class="flex-1 p-6 md:p-12 overflow-y-auto flex flex-col h-full">
                            <h2 class="text-2xl md:text-4xl font-bold font-heading mb-6 ${t.accent}" contenteditable="true">${slide.title}</h2>
                            <div class="flex flex-col md:flex-row gap-6 flex-1 h-full">
                                <div class="flex-1 space-y-4">
                                    ${slide.content.map(pt => `
                                        <div class="p-4 ${t.card} rounded-r-lg shadow-sm">
                                            <p class="text-base md:text-lg opacity-90" contenteditable="true">${pt}</p>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="w-full md:w-5/12 flex-shrink-0 h-48 md:h-auto">
                                    ${imgHtml}
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Footer (Universitet talabiga mos toza ko'rinish)
                const footerHtml = `
                    <div class="h-12 md:h-14 px-6 flex items-center justify-between text-xs md:text-sm font-semibold ${t.footBg} ${t.footText} shrink-0">
                        <span class="truncate pr-4 flex items-center gap-2">👤 Talaba: <span contenteditable="true">${userName}</span></span>
                        <span class="bg-black/20 px-3 py-1 rounded-full shrink-0">${i + 1} / ${slides.length}</span>
                    </div>
                `;

                slEl.innerHTML = contentHtml + footerHtml;
                slidesContainer.appendChild(slEl);
            });

            currentIdx = 0;
            updateNavUI();
        }

        // --- STREAMING_CHUNK:Navigation & PDF Export... ---
        function showSlide(index) {
            if (index < 0 || index >= slidesData.length) return;
            
            const curEl = document.getElementById(`sl-${currentIdx}`);
            const tgtEl = document.getElementById(`sl-${index}`);
            
            curEl.style.opacity = '0';
            setTimeout(() => {
                curEl.classList.add('hidden');
                curEl.classList.replace('z-10', 'z-0');
            }, 300);

            currentIdx = index;
            
            tgtEl.classList.remove('hidden');
            tgtEl.classList.replace('z-0', 'z-10');
            void tgtEl.offsetWidth; 
            tgtEl.style.opacity = '1';
            
            updateNavUI();
        }

        function updateNavUI() {
            document.getElementById('btn-prev').disabled = currentIdx === 0;
            document.getElementById('btn-next').disabled = currentIdx === slidesData.length - 1;
        }

        document.getElementById('btn-prev').onclick = () => showSlide(currentIdx - 1);
        document.getElementById('btn-next').onclick = () => showSlide(currentIdx + 1);
        
        document.getElementById('btn-close').onclick = () => {
            document.getElementById('viewer-view').classList.add('hidden');
            document.getElementById('viewer-view').classList.remove('flex');
            document.getElementById('settings-view').classList.remove('hidden');
        };

        // PDF Generation
        document.getElementById('btn-pdf').onclick = async () => {
            const btnPdf = document.getElementById('btn-pdf');
            const originalHtml = btnPdf.innerHTML;
            btnPdf.innerHTML = 'Yuklanmoqda...';
            btnPdf.disabled = true;

            const container = document.getElementById('slides-container');
            const allSlides = document.querySelectorAll('.slide-container');

            container.classList.add('pdf-mode');
            
            allSlides.forEach(s => {
                s.classList.remove('hidden', 'absolute', 'inset-0');
                s.style.opacity = '1';
            });

            const opt = {
                margin:       0,
                filename:     'AI_Taqdimot.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'px', format: [1280, 720], orientation: 'landscape' }
            };

            try {
                await html2pdf().set(opt).from(container).save();
            } catch (err) {
                console.error(err);
                alert("PDF saqlashda xatolik. Internetni tekshiring.");
            } finally {
                container.classList.remove('pdf-mode');
                allSlides.forEach((s, idx) => {
                    s.classList.add('absolute', 'inset-0');
                    if (idx !== currentIdx) {
                        s.classList.add('hidden');
                        s.style.opacity = '0';
                    }
                });
                btnPdf.innerHTML = originalHtml;
                btnPdf.disabled = false;
            }
        };
    </script>
</body>
</html>
