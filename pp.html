<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taqdimot Generatori</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .slide { 
            aspect-ratio: 16/9; 
            width: 100%; 
            max-width: 900px; 
            margin: 0 auto 20px auto; 
            position: relative; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            page-break-after: always;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .slide-content { flex: 1; display: flex; flex-direction: column; padding: 2rem; }
        .editable[contenteditable="true"]:hover { outline: 2px dashed #3b82f6; border-radius: 4px; padding: 2px; }
        .image-container { position: relative; cursor: pointer; flex: 1; min-height: 200px; margin-top: 1rem; border-radius: 0.5rem; overflow: hidden; background: #e5e7eb; }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }
        .image-container::after {
            content: "Rasmni o'zgartirish";
            position: absolute; inset: 0; background: rgba(0,0,0,0.5); color: white; 
            display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s;
        }
        .image-container:hover::after { opacity: 1; }
        #loading { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-lg mb-8" id="controls">
        <h1 class="text-3xl font-bold text-center mb-2 text-blue-600">Avtomatik Taqdimot</h1>
        <p class="text-center text-gray-500 mb-6">Mavzuni tanlang, AI matn va rasm qo'yadi. Tahrirlang va PDF oling.</p>

        <div id="errorBox" class="hidden mb-4 p-4 bg-red-100 text-red-700 rounded-lg text-sm font-medium"></div>

        <form id="generatorForm" onsubmit="generateSlides(event)" class="space-y-4">
            <div>
                <label class="block font-semibold mb-1 text-sm">1. Ism va Familiyangiz</label>
                <input type="text" id="studentName" required placeholder="Masalan: Akmaljon Jo'raqo'ziyev" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block font-semibold mb-1 text-sm">2. Mavzuni tanlang</label>
                <select id="topic" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="Pedagogika fanining predmetini kamida 2 ta ilmiy manbadan o‘rganing. Manbalardagi ta’riflarni taqqoslab, o‘z xulosangizni bering.">1. Pedagogika fanining predmeti va ta'riflari</option>
                    <option value="Pedagogikaning obyekti va predmeti o‘rtasidagi farqni aniqlang. Universitet hayotidan 2 ta misol keltiring.">2. Obyekt va predmet farqi (Universitet misolida)</option>
                    <option value="Pedagogikaning maqsad va vazifalarini aniqlang. Zamonaviy oliy ta’limda qaysi vazifa eng ko‘p namoyon bo‘lishini dalillang.">3. Pedagogikaning maqsad va vazifalari</option>
                    <option value="Ta’lim, tarbiya, rivojlanish, shakllanish tushunchalarini ilmiy manbalardan toping va ularning o‘zaro bog‘liqligini sxema qiling.">4. Ta’lim, tarbiya va rivojlanish bog'liqligi</option>
                    <option value="Pedagogikaning psixologiya bilan aloqasini o‘rganing. Psixologik bilim bo‘lmasa, pedagog qanday muammoga duch kelishi mumkin?">5. Pedagogika va psixologiya aloqasi</option>
                    <option value="Pedagogikaning falsafa bilan aloqasini tadqiq qiling. Falsafiy qarashlar ta’lim maqsadiga qanday ta’sir qiladi?">6. Pedagogikaning falsafa bilan aloqasi</option>
                    <option value="Kuzatish metodini o‘rganing. Universitetdagi bitta darsni kuzatish uchun 5 ta mezondan iborat kuzatuv jadvali tuzing.">7. Kuzatish metodi (5 ta mezon)</option>
                    <option value="So‘rovnoma metodidan foydalanib, 5–10 talabadan Samarali seminar qanday bo‘lishi kerak? mavzusida ma’lumot to‘plang va xulosa chiqaring.">8. Samarali seminar qanday bo'lishi kerak?</option>
                    <option value="Pedagogik eksperiment nima? Universitet sharoitida o‘tkazish mumkin bo‘lgan kichik eksperiment loyihasini ishlab chiqing.">9. Pedagogik eksperiment loyihasi</option>
                    <option value="Nazariy va empirik tadqiqot metodlarini taqqoslang. Har biriga kamida 4 tadan misol toping.">10. Nazariy va empirik tadqiqot metodlari</option>
                    <option value="Pedagogik tadqiqotda ilmiy faraz (gipoteza) nima? O‘zingiz bitta pedagogik muammo tanlab, unga gipoteza tuzing.">11. Pedagogik tadqiqotda ilmiy faraz (gipoteza)</option>
                    <option value="Pedagogika boshqa fanlarsiz rivojlana oladimi? mavzusida 2 tomonlama argument tayyorlang: ha va yo‘q pozitsiyalari uchun dalil toping.">12. Pedagogika boshqa fanlarsiz rivojlana oladimi?</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold mb-1 text-sm">3. Slaydlar soni</label>
                    <select id="slideCount" class="w-full p-3 border rounded-lg outline-none">
                        <option value="3">3 ta bet</option>
                        <option value="4">4 ta bet</option>
                        <option value="5" selected>5 ta bet</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold mb-1 text-sm">4. Dizayn Temasi</label>
                    <select id="theme" class="w-full p-3 border rounded-lg outline-none">
                        <option value="bg-white text-gray-900 border-t-8 border-blue-600">Akademik (Klassik)</option>
                        <option value="bg-slate-900 text-white border-b-8 border-indigo-500">Tungi (Qoramtir)</option>
                        <option value="bg-blue-50 text-blue-900 border-l-8 border-blue-500">Moviy (Sokin)</option>
                        <option value="bg-green-50 text-green-900 border-r-8 border-green-500">Yashil (Tabiat)</option>
                        <option value="bg-gray-100 text-gray-800 rounded-2xl">Minimalist (Kulrang)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition mt-4">
                🚀 Slaydlarni Yaratish
            </button>
        </form>

        <div id="loading" class="text-center mt-6">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-2"></div>
            <p class="text-blue-600 font-semibold animate-pulse">Sun'iy intellekt ma'lumot qidirmoqda va rasmlar chizmoqda... (10-15 soniya)</p>
        </div>
    </div>

    <!-- Slaydlar chiqadigan joy -->
    <div id="slidesContainer" class="max-w-4xl mx-auto hidden"></div>

    <!-- PDF Yuklash tugmasi -->
    <div class="max-w-4xl mx-auto text-center mt-6 mb-12 hidden" id="downloadBtnContainer">
        <button onclick="downloadPDF()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition text-lg flex items-center justify-center mx-auto gap-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            PDF Formatida Saqlab Olish
        </button>
        <p class="text-sm text-gray-500 mt-2">Maslahat: Yuklab olishdan oldin matnlarni bosib tahrirlashingiz yoki rasm ustiga bosib almashtirishingiz mumkin.</p>
    </div>

    <!-- Rasm yuklash uchun yashirin input -->
    <input type="file" id="imageUpload" accept="image/*" class="hidden">

    <script>
        // API Kalit kodning ichiga yashirildi
        const API_KEY = "AIzaSyDZZ6FmeMVA6QPc8f-P-lGKsl677XqcFpg";
        
        let currentImageTarget = null;

        // Rasm almashtirish logikasi
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && currentImageTarget) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageTarget.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        function triggerImageUpload(imgElement) {
            currentImageTarget = imgElement;
            document.getElementById('imageUpload').click();
        }

        async function generateSlides(event) {
            event.preventDefault(); // Sahifa yangilanishini to'xtatadi
            
            const name = document.getElementById('studentName').value;
            const topic = document.getElementById('topic').value;
            const count = document.getElementById('slideCount').value;
            const theme = document.getElementById('theme').value;
            
            const errorBox = document.getElementById('errorBox');
            const loading = document.getElementById('loading');
            const slidesContainer = document.getElementById('slidesContainer');
            const downloadBtn = document.getElementById('downloadBtnContainer');

            errorBox.classList.add('hidden');
            slidesContainer.innerHTML = '';
            slidesContainer.classList.add('hidden');
            downloadBtn.classList.add('hidden');
            loading.style.display = 'block';

            const prompt = `
            Siz professional pedagogikasiz. Quyidagi mavzuda O'zbek tilida taqdimot matnini yozib bering.
            Mavzu: "${topic}"
            Slaydlar soni: ${count} ta.
            Javobingizni QAT'IY ravishda faqat quyidagi JSON formatida qaytaring, boshqa hech qanday izoh qo'shmang (```json yozuvlarini ham qo'shmang):
            [
                {
                    "title": "1-slayd sarlavhasi",
                    "text": "1-slayd uchun qisqa va lo'nda ma'lumot (3-4 gap). Dalillar bilan.",
                    "imgPrompt": "A conceptual vector art illustration about [mavzuga oid kalit so'z ingliz tilida], education, minimalist, light background"
                },
                ...
            ]
            `;

            try {
                const response = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$){API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) {
                    throw new Error("API xatosi: Kalit bloklangan bo'lishi mumkin yoki internet yomon.");
                }

                const data = await response.json();
                let resultText = data.candidates[0].content.parts[0].text;
                
                // Markdown formatini tozalash (JSON ni ajratib olish)
                resultText = resultText.replace(/```json/gi, '').replace(/```/gi, '').trim();
                
                const slideData = JSON.parse(resultText);

                slideData.forEach((slide, index) => {
                    // Pollinations AI orqali rasm URL yaratish (bo'shliqlarni %20 ga almashtiramiz)
                    const imgUrl = `[https://image.pollinations.ai/prompt/$](https://image.pollinations.ai/prompt/$){encodeURIComponent(slide.imgPrompt)}?width=800&height=400&nologo=true`;

                    const slideHtml = `
                        <div class="slide ${theme}">
                            <div class="slide-content">
                                <h2 class="text-3xl md:text-4xl font-bold mb-4 editable" contenteditable="true">${slide.title}</h2>
                                <p class="text-lg md:text-xl mb-4 flex-1 editable" contenteditable="true">${slide.text}</p>
                                <div class="image-container" onclick="triggerImageUpload(this.querySelector('img'))">
                                    <img src="${imgUrl}" alt="Slayd rasmi" crossorigin="anonymous">
                                </div>
                            </div>
                            <div class="absolute bottom-4 left-6 right-6 flex justify-between text-sm font-semibold opacity-60">
                                <span class="editable" contenteditable="true">Talaba: ${name}</span>
                                <span>${index + 1} / ${count}</span>
                            </div>
                        </div>
                    `;
                    slidesContainer.innerHTML += slideHtml;
                });

                loading.style.display = 'none';
                slidesContainer.classList.remove('hidden');
                downloadBtn.classList.remove('hidden');

            } catch (error) {
                loading.style.display = 'none';
                errorBox.innerText = `Xatolik yuz berdi: ${error.message} (Yoki AI noto'g'ri format qaytardi, qayta urinib ko'ring).`;
                errorBox.classList.remove('hidden');
            }
        }

        function downloadPDF() {
            const element = document.getElementById('slidesContainer');
            const opt = {
                margin:       0,
                filename:     'Pedagogika_Taqdimot.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
            };
            
            const btn = document.querySelector('#downloadBtnContainer button');
            const originalText = btn.innerHTML;
            btn.innerText = "PDF tayyorlanmoqda...";
            
            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = originalText;
            });
        }
    </script>
</body>
</html>
