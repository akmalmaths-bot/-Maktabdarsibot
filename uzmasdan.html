    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'draw') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'win') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(554, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            }
        }

            playSound('win');

            "150,100 250,100 100,180 300,180 150,240 250,240 100,320 300,320 200,360 200,160 200,280|0,1 0,2 1,3 2,4 3,5 4,6 5,7 6,8 7,8 0,9 1,9 2,9 3,9 4,10 5,10 6,10 7,10 9,10", // 89
            "150,100 250,100 100,180 300,180 150,240 250,240 100,320 300,320 200,360 200,160 200,280|0,1 0,2 1,3 2,4 3,5 4,6 5,7 6,8 7,8 0,9 1,9 2,9 3,9 4,10 5,10 6,10 7,10 9,10", // 90
            "200,80 150,140 250,140 100,200 300,200 200,200 150,280 250,280 100,360 300,360|0,1 0,2 1,3 2,4 3,7 4,8 7,9 8,9 1,5 2,5 3,5 4,5 7,5 8,5 0,5", // 91
            "200,80 150,140 250,140 100,200 300,200 200,200 150,280 250,280 100,360 300,360|0,1 0,2 1,3 2,4 3,7 4,8 7,9 8,9 1,5 2,5 3,5 4,5 7,5 8,5 0,5", // 92
            "200,80 150,160 250,160 100,240 300,240 150,300 250,300 200,360 200,240|0,1 0,2 1,3 2,4 3,8 4,8 5,8 6,8 5,7 6,7 1,8 2,8", // 93
            "200,80 150,160 250,160 100,240 300,240 150,300 250,300 200,360 200,240|0,1 0,2 1,3 2,4 3,8 4,8 5,8 6,8 5,7 6,7 1,8 2,8", // 94
            "200,100 100,200 300,200 150,150 250,150 150,250 250,250 200,300 200,380|0,1 0,2 1,2 3,4 1,3 2,4 1,5 2,6 5,7 6,7 7,8 5,6", // 95
            "200,100 100,200 300,200 150,150 250,150 150,250 250,250 200,300 200,380|0,1 0,2 1,2 3,4 1,3 2,4 1,5 2,6 5,7 6,7 7,8 5,6", // 96
            "160,100 240,100 100,220 300,220 140,300 260,300 200,380 200,200 140,180 260,180|0,1 0,2 1,3 2,4 3,5 4,6 5,6 2,7 3,7 4,7 5,7 8,7 9,7 0,8 1,9 8,2 9,3", // 97
            "160,100 240,100 100,220 300,220 140,300 260,300 200,380 200,200 140,180 260,180|0,1 0,2 1,3 2,4 3,5 4,6 5,6 2,7 3,7 4,7 5,7 8,7 9,7 0,8 1,9 8,2 9,3", // 98
            "100,140 200,140 300,140 100,240 200,240 300,240 100,340 200,340 300,340 50,240 350,240|0,1 1,2 3,4 4,5 6,7 7,8 0,3 1,4 2,5 3,6 4,7 5,8 0,9 6,9 2,10 8,10 3,9 5,10 0,4 2,4 6,4 8,4", // 99
            "100,140 200,140 300,140 100,240 200,240 300,240 100,340 200,340 300,340 50,240 350,240|0,1 1,2 3,4 4,5 6,7 7,8 0,3 1,4 2,5 3,6 4,7 5,8 0,9 6,9 2,10 8,10 3,9 5,10 0,4 2,4 6,4 8,4" // 100
        ];

        let levels = [];
        levelsData.forEach(data => {
            let parts = data.split('|');
            let nodes = parts[0].split(' ').map(p => { let c = p.split(','); return {x: parseInt(c[0]), y: parseInt(c[1])}; });
            let edges = parts[1].split(' ').map(e => { let c = e.split(','); return [parseInt(c[0]), parseInt(c[1])]; });
            levels.push({nodes, edges});
        });

        let currentLevelIdx = 0;
        let path = [];
        let isDragging = false;
        let pointerPos = null;
        let hitRadius = 35; 
        let levelCompleted = false;

        function initLevel() {
            path = [];
            isDragging = false;
            pointerPos = null;
            levelCompleted = false;
            winMessage.classList.add('hidden');
            winMessage.classList.remove('pop-animation');
            levelIndicator.textContent = `${currentLevelIdx + 1}-Boshqotirma`;
            draw();
        }

        function resetPath(userClicked = false) {
            if(userClicked && path.length > 0) playSound('error');
            path = [];
            draw();
        }

        function nextLevel() {
            currentLevelIdx++;
            if (currentLevelIdx >= 100) currentLevelIdx = 0;
            initLevel();
        }

        function getEdgeString(n1, n2) { return Math.min(n1, n2) + '-' + Math.max(n1, n2); }

        function getDrawnEdges() {
            let drawn = new Set();
            for(let i = 0; i < path.length - 1; i++) {
                drawn.add(getEdgeString(path[i], path[i+1]));
            }
            return drawn;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const level = levels[currentLevelIdx];
            const drawnEdges = getDrawnEdges();

            level.edges.forEach(edge => {
                const n1 = level.nodes[edge[0]];
                const n2 = level.nodes[edge[1]];
                const edgeStr = getEdgeString(edge[0], edge[1]);
                
                ctx.beginPath();
                ctx.moveTo(n1.x, n1.y);
                ctx.lineTo(n2.x, n2.y);
                ctx.lineWidth = 12;
                ctx.lineCap = 'round';
                ctx.strokeStyle = drawnEdges.has(edgeStr) ? '#2563eb' : '#cbd5e1'; 
                ctx.stroke();
            });

            if (isDragging && path.length > 0 && pointerPos) {
                const lastNode = level.nodes[path[path.length - 1]];
                ctx.beginPath();
                ctx.moveTo(lastNode.x, lastNode.y);
                ctx.lineTo(pointerPos.x, pointerPos.y);
                ctx.lineWidth = 12;
                ctx.lineCap = 'round';
                ctx.strokeStyle = 'rgba(37, 99, 235, 0.4)';
                ctx.stroke();
            }

            level.nodes.forEach((node, idx) => {
                ctx.beginPath();
                ctx.arc(node.x, node.y, 16, 0, Math.PI * 2);
                ctx.fillStyle = path.includes(idx) ? '#1e40af' : '#94a3b8';
                ctx.fill();
                
                if (path.length > 0 && path[path.length - 1] === idx) {
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                }
            });
        }

        function getPointerPos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function getHoveredNode(pos, nodes) {
            for (let i = 0; i < nodes.length; i++) {
                const dx = pos.x - nodes[i].x;
                const dy = pos.y - nodes[i].y;
                if (Math.sqrt(dx*dx + dy*dy) < hitRadius) return i;
            }
            return -1;
        }

        function handlePointerDown(e) {
            if (levelCompleted || (!e.touches && e.button !== 0)) return; 
            if (!e.touches) e.preventDefault();
            
            const pos = getPointerPos(e);
            const level = levels[currentLevelIdx];
            const nodeIdx = getHoveredNode(pos, level.nodes);

            if (nodeIdx !== -1) {
                isDragging = true;
                if (path.length === 0) {
                    path.push(nodeIdx);
                    playSound('draw');
                } else if (path[path.length - 1] !== nodeIdx) {
                    checkAndAddNode(nodeIdx, level);
                }
                pointerPos = pos;
                draw();
            }
        }

        function handlePointerMove(e) {
            if (!isDragging || levelCompleted) return;
            if (!e.touches) e.preventDefault();
            
            pointerPos = getPointerPos(e);
            const level = levels[currentLevelIdx];
            const nodeIdx = getHoveredNode(pointerPos, level.nodes);

            if (nodeIdx !== -1 && path.length > 0) {
                checkAndAddNode(nodeIdx, level);
            }
            draw();
        }

        function handlePointerUp() {
            if(!isDragging) return;
            isDragging = false;
            pointerPos = null;
            draw();
            
            const level = levels[currentLevelIdx];
            const drawnEdges = getDrawnEdges();
            
            if (!levelCompleted && drawnEdges.size === level.edges.length && drawnEdges.size > 0) {
                levelCompleted = true; 
                playSound('win');
                
                setTimeout(() => {
                    if (currentLevelIdx === 99) {
                        winMessage.innerHTML = `
                            <div class="text-6xl mb-2">🏆</div>
                            <h2 class="text-3xl font-black text-blue-600 mb-2">Qoyilmaqom!</h2>
                            <p class="text-slate-600 mb-6 text-center px-4 font-semibold">Siz barcha 100 ta bosqichni muvaffaqiyatli yakunladingiz!</p>
                            <button onclick="nextLevel()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transform transition active:scale-95">
                                Boshidan boshlash
                            </button>
                        `;
                    } else {
                        winMessage.innerHTML = `
                            <div class="text-6xl mb-2">✨</div>
                            <h2 class="text-3xl font-black text-blue-600 mb-6">Ajoyib!</h2>
                            <button onclick="nextLevel()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-10 rounded-xl shadow-lg transform transition active:scale-95 text-lg">
                                Keyingisi ➔
                            </button>
                        `;
                    }
                    winMessage.classList.add('pop-animation');
                    winMessage.classList.remove('hidden');
                }, 300);
            }
        }

        function checkAndAddNode(nodeIdx, level) {
            const lastNodeIdx = path[path.length - 1];
            if (nodeIdx === lastNodeIdx) return;

            const edgeExists = level.edges.find(e => 
                (e[0] === nodeIdx && e[1] === lastNodeIdx) || 
                (e[1] === nodeIdx && e[0] === lastNodeIdx)
            );

            if (edgeExists) {
                const edgeStr = getEdgeString(nodeIdx, lastNodeIdx);
                const drawnEdges = getDrawnEdges();
                
                if (!drawnEdges.has(edgeStr)) {
                    path.push(nodeIdx);
                    playSound('draw');
                }
            }
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        
        canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
        canvas.addEventListener('touchmove', handlePointerMove, {passive: false});
        window.addEventListener('touchend', handlePointerUp);
    </script>
</body>
