<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bir Chiziq Boshqotirmasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { touch-action: none; /* Ekranda tortganda sahifa siljib ketmasligi uchun */ }
        .canvas-container { position: relative; }
        #gameCanvas {
            background-color: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
            height: auto;
            aspect-ratio: 1 / 1;
            touch-action: none;
        }
        .pop-animation { animation: pop 0.3s ease-out; }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex flex-col items-center justify-center font-sans p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 relative">
        <!-- Sarlavha -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Bir Chiziq ✏️</h1>
            <p class="text-gray-500 text-sm mt-1">Qo'l uzmasdan barcha nuqtalarni tutashtiring</p>
        </div>

        <!-- Bosqich va holat -->
        <div class="flex justify-between items-center mb-4 px-2">
            <span class="text-lg font-bold text-indigo-600" id="level-indicator">1-Bosqich</span>
            <button onclick="resetPath()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 py-1 px-3 rounded-full transition">
                🔄 Tozalash
            </button>
        </div>

        <!-- O'yin maydoni -->
        <div class="canvas-container flex justify-center mb-6">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <!-- G'alaba xabari -->
            <div id="win-message" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-white bg-opacity-90 rounded-2xl pop-animation z-10">
                <div class="text-5xl mb-2">🎉</div>
                <h2 class="text-2xl font-bold text-green-500 mb-4">Ajoyib!</h2>
                <button onclick="nextLevel()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105">
                    Keyingi bosqich ➔
                </button>
            </div>
        </div>

        <!-- Yozuv (Mualliflik) -->
        <div class="text-center border-t pt-4">
            <p class="text-xs text-gray-400 font-medium">Test tuzuvchi: Akmaljon Jo'raqo'ziyev</p>
            <div class="flex justify-center gap-4 mt-2">
                <a href="https://t.me/Matemdarsi" target="_blank" class="text-sm text-blue-500 hover:text-blue-600 font-semibold">@Matemdarsi</a>
                <span class="text-gray-300">|</span>
                <a href="https://t.me/Akmalmaths" target="_blank" class="text-sm text-blue-500 hover:text-blue-600 font-semibold">@Akmalmaths</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const winMessage = document.getElementById('win-message');
        const levelIndicator = document.getElementById('level-indicator');

        // Kitobdagi rasmlar asosida tuzilgan bosqichlar
        const levels = [
            { // 1. Kvadrat (Oddiy)[cite: 2]
                nodes: [{x:100, y:100}, {x:300, y:100}, {x:300, y:300}, {x:100, y:300}],
                edges: [[0,1], [1,2], [2,3], [3,0]]
            },
            { // 2. Uy shakli (05-boshqotirma)[cite: 1]
                nodes: [{x:200, y:60}, {x:80, y:180}, {x:320, y:180}, {x:80, y:320}, {x:320, y:320}],
                edges: [[0,1], [0,2], [1,2], [1,3], [1,4], [2,3], [2,4], [3,4]]
            },
            { // 3. Yulduz (02-boshqotirma)[cite: 2]
                nodes: [{x:200, y:40}, {x:340, y:150}, {x:290, y:340}, {x:110, y:340}, {x:60, y:150}],
                edges: [[0,2], [2,4], [4,1], [1,3], [3,0]]
            },
            { // 4. Olmos (09-boshqotirma uslubida)[cite: 3]
                nodes: [{x:200, y:40}, {x:80, y:200}, {x:320, y:200}, {x:200, y:360}, {x:200, y:200}],
                edges: [[0,1], [0,2], [1,3], [2,3], [0,4], [1,4], [2,4], [3,4]]
            }
        ];

        let currentLevelIdx = 0;
        let path = []; // Bosib o'tilgan nuqtalar ketma-ketligi
        let isDragging = false;
        let pointerPos = null;
        let hitRadius = 30; // Nuqtani sezish radiusi

        function initLevel() {
            path = [];
            isDragging = false;
            pointerPos = null;
            winMessage.classList.add('hidden');
            levelIndicator.textContent = `${currentLevelIdx + 1}-Bosqich`;
            draw();
        }

        function resetPath() {
            path = [];
            draw();
        }

        function nextLevel() {
            currentLevelIdx++;
            if (currentLevelIdx >= levels.length) {
                currentLevelIdx = 0; // Boshiga qaytish
            }
            initLevel();
        }

        function getEdgeString(n1, n2) {
            return Math.min(n1, n2) + '-' + Math.max(n1, n2);
        }

        function getDrawnEdges() {
            let drawn = new Set();
            for(let i = 0; i < path.length - 1; i++) {
                drawn.add(getEdgeString(path[i], path[i+1]));
            }
            return drawn;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const level = levels[currentLevelIdx];
            const drawnEdges = getDrawnEdges();

            // Chiziqlarni chizish
            level.edges.forEach(edge => {
                const n1 = level.nodes[edge[0]];
                const n2 = level.nodes[edge[1]];
                const edgeStr = getEdgeString(edge[0], edge[1]);
                
                ctx.beginPath();
                ctx.moveTo(n1.x, n1.y);
                ctx.lineTo(n2.x, n2.y);
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                ctx.strokeStyle = drawnEdges.has(edgeStr) ? '#4f46e5' : '#e5e7eb'; // Chizilgani ko'k, qolgani kulrang
                ctx.stroke();
            });

            // Sudralayotgan (qalam) chizig'ini chizish
            if (isDragging && path.length > 0 && pointerPos) {
                const lastNode = level.nodes[path[path.length - 1]];
                ctx.beginPath();
                ctx.moveTo(lastNode.x, lastNode.y);
                ctx.lineTo(pointerPos.x, pointerPos.y);
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                ctx.strokeStyle = 'rgba(79, 70, 229, 0.5)';
                ctx.stroke();
            }

            // Nuqtalarni chizish
            level.nodes.forEach((node, idx) => {
                ctx.beginPath();
                ctx.arc(node.x, node.y, 16, 0, Math.PI * 2);
                ctx.fillStyle = path.includes(idx) ? '#3730a3' : '#9ca3af';
                ctx.fill();
                
                // Oxirgi turgan nuqtani ajratib ko'rsatish
                if (path.length > 0 && path[path.length - 1] === idx) {
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                }
            });
        }

        // Kordinatalarni Canvas o'lchamiga to'g'rilash
        function getPointerPos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function getHoveredNode(pos, nodes) {
            for (let i = 0; i < nodes.length; i++) {
                const dx = pos.x - nodes[i].x;
                const dy = pos.y - nodes[i].y;
                if (Math.sqrt(dx*dx + dy*dy) < hitRadius) {
                    return i;
                }
            }
            return -1;
        }

        function handlePointerDown(e) {
            if (!e.touches) e.preventDefault();
            const pos = getPointerPos(e);
            const level = levels[currentLevelIdx];
            const nodeIdx = getHoveredNode(pos, level.nodes);

            if (nodeIdx !== -1) {
                isDragging = true;
                // Agar bo'sh bo'lsa yoki oxirgi nuqta ustida bosilsa davom ettiramiz
                if (path.length === 0) {
                    path.push(nodeIdx);
                } else if (path[path.length - 1] !== nodeIdx) {
                    // Agar boshqa nuqtadan boshlamoqchi bo'lsa, xato. Lekin qulaylik uchun o'sha nuqtaga ulashga harakat qilamiz
                    checkAndAddNode(nodeIdx, level);
                }
                pointerPos = pos;
                draw();
            }
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            if (!e.touches) e.preventDefault();
            
            pointerPos = getPointerPos(e);
            const level = levels[currentLevelIdx];
            const nodeIdx = getHoveredNode(pointerPos, level.nodes);

            if (nodeIdx !== -1 && path.length > 0) {
                checkAndAddNode(nodeIdx, level);
            }
            draw();
        }

        function handlePointerUp() {
            isDragging = false;
            pointerPos = null;
            draw();
            
            // G'alabani tekshirish
            const level = levels[currentLevelIdx];
            const drawnEdges = getDrawnEdges();
            if (drawnEdges.size === level.edges.length && drawnEdges.size > 0) {
                setTimeout(() => {
                    winMessage.classList.remove('hidden');
                }, 100);
            }
        }

        function checkAndAddNode(nodeIdx, level) {
            const lastNodeIdx = path[path.length - 1];
            if (nodeIdx === lastNodeIdx) return; // O'ziga o'zi ulash mumkin emas

            // Shu ikki nuqta o'rtasida chiziq borligini tekshirish
            const edgeExists = level.edges.find(e => 
                (e[0] === nodeIdx && e[1] === lastNodeIdx) || 
                (e[1] === nodeIdx && e[0] === lastNodeIdx)
            );

            if (edgeExists) {
                // Chiziq oldin chizilmaganligini tekshirish
                const edgeStr = getEdgeString(nodeIdx, lastNodeIdx);
                const drawnEdges = getDrawnEdges();
                
                if (!drawnEdges.has(edgeStr)) {
                    path.push(nodeIdx);
                }
            }
        }

        // Hodisalarni biriktirish
        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        
        canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
        canvas.addEventListener('touchmove', handlePointerMove, {passive: false});
        window.addEventListener('touchend', handlePointerUp);

        // O'yinni boshlash
        initLevel();
    </script>
</body>
</html>
