<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelajak O'quv Markazi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-height: 80vh; }
        
        h1, h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .back-btn { background: #34495e; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; display: none; }
        
        /* Bo'limlar - To'g'ri to'rtburchak */
        .categories-grid { display: flex; flex-direction: column; gap: 15px; }
        .category-card { background: #3498db; color: white; padding: 25px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; text-align: center; transition: 0.3s; }
        .category-card:hover { background: #2980b9; transform: translateY(-3px); }

        /* Fanlar - Kvadrat */
        .subjects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; display: none; }
        .subject-card { background: #2ecc71; color: white; aspect-ratio: 1 / 1; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; transition: 0.3s; }
        .subject-card:hover { background: #27ae60; transform: scale(1.05); }

        /* Fan haqida ma'lumot */
        .detail-view { display: none; }
        .info-box { background: #ecf0f1; padding: 15px; border-radius: 8px; margin-bottom: 20px; line-height: 1.6; }
        .info-box span { font-weight: bold; color: #2c3e50; }
        
        /* Ro'yxatdan o'tish formasi */
        .register-btn { background: #e74c3c; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; display: block; margin: 0 auto; transition: 0.3s; font-weight: bold;}
        .register-btn:hover { background: #c0392b; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; position: relative; }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #7f8c8d; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; }
        
        .submit-btn { background: #2ecc71; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .submit-btn:disabled { background: #95a5a6; cursor: not-allowed; }

        /* Yashirin Admin Panel ulagichi */
        .secret-admin { position: fixed; bottom: 10px; right: 10px; width: 20px; height: 20px; cursor: pointer; opacity: 0.1; }
        
        /* Admin Panel UI */
        .admin-panel { display: none; }
        .admin-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .admin-table th { background-color: #34495e; color: white; }
    </style>
</head>
<body>

<div class="container">
    <button class="back-btn" id="backBtn" onclick="goBack()">🔙 Orqaga</button>
    <h1 id="pageTitle">Bo'limni tanlang</h1>

    <!-- Kategoriyalar -->
    <div class="categories-grid" id="categoriesView"></div>

    <!-- Fanlar -->
    <div class="subjects-grid" id="subjectsView"></div>

    <!-- Fan ma'lumotlari -->
    <div class="detail-view" id="detailView">
        <h2 id="detailTitle">Fan Nomi</h2>
        <div class="info-box" id="detailInfo">
            <!-- JS orqali to'ldiriladi -->
        </div>
        <div class="info-box" id="teacherInfo">
            <!-- JS orqali to'ldiriladi -->
        </div>
        <button class="register-btn" onclick="openModal()">Ro'yxatdan o'tish</button>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <h2>🛠 Admin Panel</h2>
        <h3>Ro'yxatdan o'tganlar</h3>
        <table class="admin-table">
            <thead>
                <tr><th>Ism</th><th>Familiya</th><th>Sinf</th><th>Telefon</th><th>Fan</th></tr>
            </thead>
            <tbody id="studentsList"></tbody>
        </table>
        
        <hr><br>
        <h3>Tahrirlash (Siz so'ragan funksiya)</h3>
        <p style="color:red; font-size: 12px;">*Baza serverga ulanmagani uchun o'zgarishlar faqat shu kompyuterda saqlanadi.</p>
        <div class="form-group">
            <label>Qaysi fanni o'zgartirmoqchisiz?</label>
            <input type="text" id="editSubjectName" placeholder="Masalan: Matematika">
        </div>
        <div class="form-group">
            <label>Oylik to'lov</label>
            <input type="text" id="editPrice" placeholder="Masalan: 600 000 so'm">
        </div>
        <button class="submit-btn" style="background:#f39c12;" onclick="saveSubjectEdit()">Saqlash</button>
    </div>
</div>

<!-- Ro'yxatdan o'tish oynasi -->
<div class="modal" id="regModal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2>Ro'yxatdan o'tish</h2>
        <form id="regForm">
            <div class="form-group">
                <label>O'quvchining ismi</label>
                <input type="text" id="r_ism" required oninput="checkForm()">
            </div>
            <div class="form-group">
                <label>O'quvchining familiyasi</label>
                <input type="text" id="r_familiya" required oninput="checkForm()">
            </div>
            <div class="form-group">
                <label>O'quvchining sinfi</label>
                <input type="text" id="r_sinf" required oninput="checkForm()">
            </div>
            <div class="form-group">
                <label>Aloqa uchun nomer</label>
                <input type="tel" id="r_nomer" required oninput="checkForm()" placeholder="+998">
            </div>
            <button type="button" class="submit-btn" id="submitBtn" disabled onclick="submitForm()">Tayyor</button>
        </form>
    </div>
</div>

<!-- Yashirin admin tugmasi (O'ng burchak pastda, ko'rinmas joy) -->
<div class="secret-admin" onclick="openAdmin()" title="Hidden Admin"></div>

<script>
    // Boshlang'ich ma'lumotlar bazasi
    const defaultData = {
        categories: {
            "Aniq fanlar": ["Matematika", "Kimyo va biologiya", "Ona tili va adabiyot", "Tarix va huquq", "Prezident maktabiga tayyorlov", "Mental arifmetika"],
            "Xorijiy tillar": ["Ingliz tili", "Rus tili", "Koreys tili", "Xitoy tili", "Nemis tili"],
            "IT va texnologiyalar": ["Robototexnika"],
            "Maktabga tayyorlov": ["Maktabga tayyorlov"],
            "Intellektual va mantiqiy": ["Shaxmat"]
        },
        subjectDetails: {
            // Default andoza (Agar alohida yozilmagan bo'lsa shuni oladi)
            "default": {
                haftada: "3 marta",
                davomiyligi: "2 soatdan",
                tolov: "600 000 so‘m",
                manzil: "Uchtepa tumani, 2-mavze, baraka market yonida",
                murojaat: "+99897 140 28 86",
                ustoz: "Kiritilmagan",
                tajriba: "Kiritilmagan",
                yutuq: "Kiritilmagan"
            }
        },
        students: []
    };

    // Ma'lumotlarni LocalStorage dan olish yoki yangi yaratish
    let db = JSON.parse(localStorage.getItem('komarkaz_db'));
    if (!db) {
        db = defaultData;
        localStorage.setItem('komarkaz_db', JSON.stringify(db));
    }

    let currentSubject = "";

    // Dastlabki yuklanish
    function init() {
        const catView = document.getElementById('categoriesView');
        catView.innerHTML = "";
        for (const cat in db.categories) {
            catView.innerHTML += `<div class="category-card" onclick="showSubjects('${cat}')">${cat}</div>`;
        }
    }

    // Fanlarni ko'rsatish
    function showSubjects(categoryName) {
        document.getElementById('categoriesView').style.display = 'none';
        document.getElementById('subjectsView').style.display = 'grid';
        document.getElementById('backBtn').style.display = 'block';
        document.getElementById('pageTitle').innerText = categoryName;

        const subView = document.getElementById('subjectsView');
        subView.innerHTML = "";
        db.categories[categoryName].forEach(sub => {
            subView.innerHTML += `<div class="subject-card" onclick="showDetail('${sub}')">${sub}</div>`;
        });
    }

    // Fan haqida batafsil
    function showDetail(subjectName) {
        currentSubject = subjectName;
        document.getElementById('subjectsView').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
        document.getElementById('pageTitle').innerText = subjectName;

        let info = db.subjectDetails[subjectName] || db.subjectDetails["default"];

        document.getElementById('detailInfo').innerHTML = `
            <p><span>Haftada:</span> ${info.haftada}</p>
            <p><span>Dars davomiyligi:</span> ${info.davomiyligi}</p>
            <p><span>Oylik to‘lov:</span> ${info.tolov}</p>
            <p><span>Manzil:</span> ${info.manzil}</p>
            <p><span>Murojaat uchun:</span> ${info.murojaat}</p>
        `;

        document.getElementById('teacherInfo').innerHTML = `
            <h3>👨‍🏫 Ustoz haqida</h3><br>
            <p><span>Ism-familiya:</span> ${info.ustoz}</p>
            <p><span>Ish tajribasi:</span> ${info.tajriba}</p>
            <p><span>Yutuqlari:</span> ${info.yutuq}</p>
        `;
    }

    // Orqaga qaytish mantiqlari
    function goBack() {
        if(document.getElementById('adminPanel').style.display === 'block'){
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('categoriesView').style.display = 'flex';
            document.getElementById('pageTitle').innerText = "Bo'limni tanlang";
            document.getElementById('backBtn').style.display = 'none';
        }
        else if(document.getElementById('detailView').style.display === 'block'){
            document.getElementById('detailView').style.display = 'none';
            document.getElementById('subjectsView').style.display = 'grid';
            document.getElementById('pageTitle').innerText = "Fanlarni tanlang";
        } else {
            document.getElementById('subjectsView').style.display = 'none';
            document.getElementById('categoriesView').style.display = 'flex';
            document.getElementById('pageTitle').innerText = "Bo'limni tanlang";
            document.getElementById('backBtn').style.display = 'none';
        }
    }

    // Modal oynani boshqarish
    function openModal() { document.getElementById('regModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('regModal').style.display = 'none'; }

    // Formani tekshirish (Hamma maydon to'lsa "Tayyor" ochiladi)
    function checkForm() {
        let ism = document.getElementById('r_ism').value;
        let fam = document.getElementById('r_familiya').value;
        let sinf = document.getElementById('r_sinf').value;
        let nomer = document.getElementById('r_nomer').value;
        let btn = document.getElementById('submitBtn');

        if(ism.trim() !== "" && fam.trim() !== "" && sinf.trim() !== "" && nomer.trim() !== "") {
            btn.disabled = false;
        } else {
            btn.disabled = true;
        }
    }

    // Ma'lumotni jo'natish
    function submitForm() {
        let student = {
            ism: document.getElementById('r_ism').value,
            fam: document.getElementById('r_familiya').value,
            sinf: document.getElementById('r_sinf').value,
            nomer: document.getElementById('r_nomer').value,
            fan: currentSubject
        };

        db.students.push(student);
        localStorage.setItem('komarkaz_db', JSON.stringify(db)); // Baza yangilandi
        
        alert("Tabriklaymiz! Siz ro'yxatdan muvaffaqiyatli o'tdingiz. Tez orada siz bilan bog'lanamiz.");
        closeModal();
        document.getElementById('regForm').reset();
        document.getElementById('submitBtn').disabled = true;
    }

    // =====================================
    // YASHIRIN ADMIN PANEL MANTIG'I
    // =====================================
    function openAdmin() {
        let pass = prompt("Admin parolini kiriting:");
        if (pass === "admin123") { // Parol: admin123
            document.getElementById('categoriesView').style.display = 'none';
            document.getElementById('subjectsView').style.display = 'none';
            document.getElementById('detailView').style.display = 'none';
            
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('pageTitle').innerText = "Admin Panel";
            
            loadAdminData();
        } else {
            alert("Noto'g'ri parol!");
        }
    }

    function loadAdminData() {
        let tbody = document.getElementById('studentsList');
        tbody.innerHTML = "";
        db.students.forEach(st => {
            tbody.innerHTML += `<tr><td>${st.ism}</td><td>${st.fam}</td><td>${st.sinf}</td><td>${st.nomer}</td><td>${st.fan}</td></tr>`;
        });
    }

    function saveSubjectEdit() {
        let subj = document.getElementById('editSubjectName').value.trim();
        let price = document.getElementById('editPrice').value.trim();
        
        if(subj && price) {
            // Agar u fan bo'lmasa, default ma'lumotlarni nusxalaymiz
            if(!db.subjectDetails[subj]) {
                db.subjectDetails[subj] = Object.assign({}, db.subjectDetails["default"]);
            }
            db.subjectDetails[subj].tolov = price; // Narxni o'zgartirish
            localStorage.setItem('komarkaz_db', JSON.stringify(db));
            alert(subj + " fani uchun narx " + price + " ga o'zgartirildi!");
        } else {
            alert("Barcha maydonlarni to'ldiring!");
        }
    }

    // Dasturni ishga tushirish
    init();

</script>
</body>
</html>
