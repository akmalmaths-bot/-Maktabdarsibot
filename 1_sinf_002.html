<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATEMATIKA 2-SINF TESTLARI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        button {
            touch-action: manipulation;
        }
        canvas {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col overflow-x-hidden">

    <header class="bg-blue-600 text-white py-4 md:py-5 px-3 sm:px-4 shadow-md">
        <div class="max-w-3xl mx-auto flex items-center justify-center gap-2">
            <div class="flex items-center gap-2 sm:gap-3 text-center">
                <div class="text-2xl sm:text-3xl">📚</div>
                <h1 class="text-lg sm:text-2xl font-bold leading-tight uppercase tracking-wide">
                    MATEMATIKA 2-SINF TESTLARI
                </h1>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-3xl mx-auto w-full p-4 md:p-6 flex flex-col justify-center">
        
        <div id="screen-start" class="bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-slate-200 text-center flex flex-col items-center">
            <h2 class="text-3xl md:text-4xl font-black text-blue-800 mb-8 uppercase tracking-widest">
                Matematika<br><span class="text-2xl md:text-3xl text-blue-600">2-sinf testlari</span>
            </h2>
            
            <button id="btn-start-test" class="w-full max-w-sm bg-blue-600 text-white font-bold text-xl py-5 rounded-2xl hover:bg-blue-700 active:scale-95 transition-all shadow-lg mb-12">
                Testni Boshlash 🚀
            </button>

            <div class="w-full pt-6 border-t border-slate-100 flex flex-col items-center gap-3">
                <p class="text-sm md:text-base text-slate-500 font-medium">Test tuzuvchi: Akmaljon Jo'raqo'ziyev</p>
                <a href="https://t.me/Maktabdarsibot" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-50 text-blue-600 rounded-full text-sm font-bold hover:bg-blue-100 transition-colors border border-blue-200">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.94z"/></svg>
                    @Maktabdarsibot
                </a>
            </div>
        </div>

        <div id="screen-quiz" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col w-full overflow-hidden">
            <div class="bg-slate-50 border-b border-slate-200 p-4 flex justify-between items-center flex-wrap gap-3">
                <h3 class="text-base md:text-lg font-semibold text-slate-800">Savollar</h3>
                <div class="flex gap-2 md:gap-3 flex-wrap">
                    <span id="score-indicator" class="px-3 md:px-4 py-1.5 bg-yellow-100 text-yellow-800 rounded-full text-xs md:text-sm font-bold flex items-center gap-1 shadow-sm border border-yellow-200">
                        ⭐ <span id="current-score">0</span>
                    </span>
                    <span id="timer-indicator" class="px-3 md:px-4 py-1.5 bg-orange-100 text-orange-800 rounded-full text-xs md:text-sm font-bold flex items-center gap-1 shadow-sm border border-orange-200">
                        ⏱ <span id="time-left">60</span>s
                    </span>
                    <span id="progress-indicator" class="px-3 md:px-4 py-1.5 bg-blue-100 text-blue-800 rounded-full text-xs md:text-sm font-bold shadow-sm border border-blue-200">
                        1 / 20
                    </span>
                </div>
            </div>
            
            <div class="p-5 md:p-8 w-full relative">
                <!-- Avtomatik o'tish kutilayotgan paytda boshqa variantlarni bosishni to'sish uchun -->
                <div id="click-blocker" class="hidden absolute inset-0 z-10"></div>
                
                <div id="question-container" class="w-full">
                    <h4 id="question-text" class="text-lg md:text-2xl font-medium text-slate-800 mb-6 md:mb-8 leading-relaxed break-words">
                        Yuklanmoqda...
                    </h4>
                    
                    <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 w-full">
                        <!-- Variantlar -->
                    </div>
                </div>

                <div id="feedback-container" class="mt-6 p-4 rounded-xl hidden text-center font-medium text-base md:text-lg w-full">
                </div>
            </div>
        </div>

        <div id="screen-result" class="hidden bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-slate-200 text-center flex flex-col items-center">
            <div id="result-emoji" class="text-7xl mb-4">🏆</div>
            <h2 id="result-title" class="text-3xl font-bold text-slate-800 mb-6">Test Yakunlandi!</h2>
            
            <div class="bg-slate-50 rounded-2xl p-6 md:p-8 border border-slate-100 w-full max-w-md mx-auto mb-8 shadow-inner">
                <p class="text-slate-500 mb-1 font-medium text-lg">To'plangan yulduzchalar:</p>
                <p id="result-stars" class="text-5xl font-black text-yellow-500 mb-6 drop-shadow-sm">0 ⭐</p>

                <p class="text-slate-500 mb-2 font-medium text-base">To'g'ri javoblar:</p>
                <p id="result-score" class="text-3xl font-bold text-blue-600 mb-3">0 / 20</p>
                <div class="w-full bg-slate-200 rounded-full h-3 mb-3 relative overflow-hidden">
                    <div id="result-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-1000 absolute left-0 top-0" style="width: 0%"></div>
                </div>
                <p id="result-percent" class="text-lg font-bold text-slate-700">0%</p>
            </div>

            <!-- Sertifikat Canvas (yashirin) -->
            <canvas id="cert-canvas" class="hidden shadow-lg border border-slate-300 rounded-xl mb-6 bg-white"></canvas>
            
            <button id="btn-download-cert" class="hidden w-full max-w-sm bg-green-600 text-white font-bold text-lg py-4 px-6 rounded-xl hover:bg-green-700 transition-all shadow-md mb-4 flex items-center justify-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Sertifikatni yuklab olish
            </button>

            <button id="btn-restart" class="w-full max-w-sm bg-slate-800 text-white font-bold text-lg py-4 px-8 rounded-xl hover:bg-slate-900 transition-all shadow-md mb-6 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Qaytadan ishlash
            </button>
            
            <a href="https://t.me/Maktabdarsibot" target="_blank" class="w-full max-w-sm inline-flex items-center justify-center gap-2 px-6 py-4 bg-blue-100 text-blue-700 rounded-xl text-base font-bold hover:bg-blue-200 transition-colors border border-blue-300">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.94z"/></svg>
                Yana shunday test ishlash uchun @Maktabdarsibot ga kiring
            </a>
        </div>

    </main>

    <script>
        const originalQuizData = [
            { question: "10 soniga 5 ni qo'shsak, natija nechaga teng bo'ladi?", options: ["15", "14", "16", "12"], correctIndex: 0 },
            { question: "Akvariumda 8 ta baliq bor edi. Dadasi yana 4 ta baliq olib keldi. Jami nechta baliq bo'ldi?", options: ["12 ta", "10 ta", "14 ta", "11 ta"], correctIndex: 0 },
            { question: "15 dan 6 ni ayirsak nechaga teng?", options: ["9", "8", "10", "7"], correctIndex: 0 },
            { question: "Haftaning uchinchi kuni qaysi?", options: ["Chorshanba", "Seshanba", "Payshanba", "Juma"], correctIndex: 0 },
            { question: "Stol ustida 12 ta qalam bor edi. Shundan 5 tasi qizil, qolganlari ko'k. Nechta ko'k qalam bor?", options: ["7 ta", "6 ta", "8 ta", "5 ta"], correctIndex: 0 },
            { question: "Qatorni davom ettiring: 10, 12, 14, 16, ?", options: ["18", "17", "20", "15"], correctIndex: 0 },
            { question: "Qaysi son 19 dan bitta oldin keladi?", options: ["18", "20", "17", "16"], correctIndex: 0 },
            { question: "7 va 8 ning yig'indisi nechaga teng?", options: ["15", "14", "16", "13"], correctIndex: 0 },
            { question: "Daraxtda 14 ta qush qo'nib turgan edi. Bir ozdan so'ng 5 tasi uchib ketdi. Daraxtda nechta qush qoldi?", options: ["9 ta", "8 ta", "10 ta", "11 ta"], correctIndex: 0 },
            { question: "3 ta uchburchakning jami nechta burchagi bor?", options: ["9 ta", "6 ta", "8 ta", "12 ta"], correctIndex: 0 },
            { question: "Ukam 6 yoshda, men undan 3 yosh kattaman. Men necha yoshdaman?", options: ["9 yoshda", "8 yoshda", "10 yoshda", "7 yoshda"], correctIndex: 0 },
            { question: "Bitta tarvuz va 3 ta qovun jami nechta meva bo'ladi?", options: ["4 ta", "3 ta", "5 ta", "2 ta"], correctIndex: 0 },
            { question: "17 soni qaysi raqamlardan yoziladi?", options: ["1 va 7", "1 va 6", "7 va 0", "7 va 1"], correctIndex: 0 },
            { question: "Men 15 sahifali ertak kitob o'qiyapman. 10 betini o'qib bo'ldim. Yana necha bet qoldi?", options: ["5 bet", "4 bet", "6 bet", "15 bet"], correctIndex: 0 },
            { question: "20 sonida nechta o'nlik bor?", options: ["2 ta", "1 ta", "0 ta", "3 ta"], correctIndex: 0 },
            { question: "Xola 18 ta tuxum sotib oldi. Uyga kelguncha 2 tasi sinib qoldi. Nechta butun tuxum qoldi?", options: ["16 ta", "15 ta", "17 ta", "14 ta"], correctIndex: 0 },
            { question: "19 dan 9 ni ayirsak qancha hosil bo'ladi?", options: ["10", "9", "8", "11"], correctIndex: 0 },
            { question: "Agar bugun juma bo'lsa, kecha qaysi kun edi?", options: ["Payshanba", "Chorshanba", "Shanba", "Yakshanba"], correctIndex: 0 },
            { question: "4 ta yengil avtomobilning jami nechta g'ildiragi bor?", options: ["16 ta", "12 ta", "14 ta", "18 ta"], correctIndex: 0 },
            { question: "10 dan kichik bo'lgan barcha juft sonlarni belgilang.", options: ["2, 4, 6, 8", "1, 3, 5, 7", "10, 12, 14", "2, 4, 5"], correctIndex: 0 }
        ];

        let quizData = [];
        let currentIndex = 0;
        let userAnswers = [];
        let questionScores = [];
        let questionTimes = [];
        let totalScore = 0;

        let timerInterval;
        let timeLeft = 60; // 60 soniya 
        let autoNextTimeout;
        const TIME_LIMIT = 60;
        const AUTO_NEXT_DELAY = 3000; // 3 soniya

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) initAudio();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'correct') {
                // Yoqimli baland ohang (To'g'ri javob)
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, now);
                oscillator.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                oscillator.start(now);
                oscillator.stop(now + 0.3);
            } else if (type === 'wrong') {
                // Past ohang (Noto'g'ri javob yoki vaqt tugashi)
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(300, now);
                oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                oscillator.start(now);
                oscillator.stop(now + 0.3);
            }
        }

        const screenStart = document.getElementById('screen-start');
        const screenQuiz = document.getElementById('screen-quiz');
        const screenResult = document.getElementById('screen-result');
        const currentScoreDisplay = document.getElementById('current-score');
        const elQuestionText = document.getElementById('question-text');
        const elOptionsContainer = document.getElementById('options-container');
        const elProgress = document.getElementById('progress-indicator');
        const elTimeLeft = document.getElementById('time-left');
        const elFeedback = document.getElementById('feedback-container');
        const clickBlocker = document.getElementById('click-blocker');

        function shuffleArray(array) {
            let newArray = JSON.parse(JSON.stringify(array)); 
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function prepareQuizData(data) {
            let shuffledQuestions = shuffleArray(data);
            shuffledQuestions.forEach(q => {
                let correctText = q.options[q.correctIndex]; 
                q.options = shuffleArray(q.options); 
                q.correctIndex = q.options.indexOf(correctText); 
            });
            return shuffledQuestions;
        }

        document.getElementById('btn-start-test').addEventListener('click', () => {
            initAudio(); // Audio context user iteratsiyasi vaqtida yoqilishi shart
            startQuiz();
        });

        function startQuiz() {
            screenStart.classList.add('hidden');
            screenQuiz.classList.remove('hidden');
            
            quizData = prepareQuizData(originalQuizData);
            userAnswers = new Array(quizData.length).fill(null);
            questionScores = new Array(quizData.length).fill(0);
            questionTimes = new Array(quizData.length).fill(TIME_LIMIT);
            
            totalScore = 0;
            currentScoreDisplay.textContent = '0';
            currentIndex = 0;

            renderQuestion();
            window.scrollTo(0, 0);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = TIME_LIMIT;
            elTimeLeft.textContent = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                questionTimes[currentIndex] = timeLeft;
                elTimeLeft.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleAnswer(-1); // Vaqt tugadi
                }
            }, 1000);
        }

        function renderQuestion() {
            const data = quizData[currentIndex];
            elQuestionText.textContent = `${currentIndex + 1}. ${data.question}`;
            elProgress.textContent = `${currentIndex + 1} / ${quizData.length}`;
            
            clearTimeout(autoNextTimeout);
            clickBlocker.classList.add('hidden'); // Blokerni olib tashlash

            if (userAnswers[currentIndex] === null) {
                startTimer();
            } else {
                clearInterval(timerInterval);
                elTimeLeft.textContent = "--";
            }
            
            elOptionsContainer.innerHTML = '';
            elFeedback.className = 'mt-6 p-4 rounded-xl hidden text-center font-medium text-base md:text-lg w-full flex-col items-center justify-center';
            elFeedback.innerHTML = '';

            data.options.forEach((optionText, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-white hover:border-blue-400 hover:bg-blue-50 transition-all font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 break-words';
                
                const letter = String.fromCharCode(65 + index); 
                let iconContent = `<span class="flex-shrink-0 inline-block w-8 h-8 text-center leading-8 bg-slate-100 text-slate-500 rounded-lg mr-3 font-bold">${letter}</span>`;
                let btnClasses = '';

                if (userAnswers[currentIndex] !== null) {
                    btn.disabled = true;
                    btn.classList.remove('hover:border-blue-400', 'hover:bg-blue-50', 'cursor-pointer');
                    
                    if (index === data.correctIndex) {
                        btnClasses = 'border-green-500 bg-green-50 text-green-800';
                        iconContent = `<span class="flex-shrink-0 inline-block w-8 h-8 text-center leading-8 bg-green-200 text-green-800 rounded-lg mr-3 font-bold">&#10003;</span>`;
                    } else if (index === userAnswers[currentIndex]) {
                        btnClasses = 'border-red-500 bg-red-50 text-red-800';
                        iconContent = `<span class="flex-shrink-0 inline-block w-8 h-8 text-center leading-8 bg-red-200 text-red-800 rounded-lg mr-3 font-bold">&#10007;</span>`;
                    } else {
                        btnClasses = 'opacity-50';
                    }
                } else {
                    btn.addEventListener('click', () => handleAnswer(index));
                }

                if(btnClasses) {
                    const classArray = btnClasses.split(' ');
                    classArray.forEach(cls => btn.classList.add(cls));
                }

                btn.innerHTML = `<div class="flex items-center w-full">${iconContent}<span class="flex-1">${optionText}</span></div>`;
                elOptionsContainer.appendChild(btn);
            });

            if (userAnswers[currentIndex] !== null) {
                const isCorrect = userAnswers[currentIndex] === data.correctIndex;
                showFeedback(isCorrect, userAnswers[currentIndex]);
            }
        }

        function handleAnswer(selectedIndex) {
            clearInterval(timerInterval);
            clickBlocker.classList.remove('hidden'); // Yana bosilishini oldini olish
            
            const data = quizData[currentIndex];
            const isCorrect = selectedIndex === data.correctIndex;

            if (userAnswers[currentIndex] === null) {
                userAnswers[currentIndex] = selectedIndex;
                
                if (selectedIndex === -1) {
                    questionScores[currentIndex] = 0;
                    playSound('wrong');
                } else if (isCorrect) {
                    playSound('correct');
                    let points = Math.ceil((timeLeft / TIME_LIMIT) * 5);
                    if (points < 1) points = 1;
                    if (points > 5) points = 5;
                    questionScores[currentIndex] = points;
                    totalScore += points;
                    currentScoreDisplay.textContent = totalScore;
                } else {
                    playSound('wrong');
                    questionScores[currentIndex] = 0;
                }
            }
            
            renderQuestion(); 

            // 3 soniyadan keyin avtomatik keyingi savolga o'tish (yoki tugatish)
            let countdown = 3;
            elFeedback.innerHTML += `<div class="text-sm mt-2 font-bold opacity-80" id="auto-next-timer">Keyingi savolga ${countdown} soniyada o'tiladi...</div>`;
            
            const countdownInterval = setInterval(() => {
                countdown--;
                const timerEl = document.getElementById('auto-next-timer');
                if(timerEl) timerEl.textContent = `Keyingi savolga ${countdown} soniyada o'tiladi...`;
            }, 1000);

            autoNextTimeout = setTimeout(() => {
                clearInterval(countdownInterval);
                if (currentIndex < quizData.length - 1) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    showResult();
                }
            }, AUTO_NEXT_DELAY);
        }

        function showFeedback(isCorrect, selectedIndex) {
            elFeedback.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'bg-orange-100', 'text-orange-800');
            
            if (selectedIndex === -1) {
                elFeedback.classList.add('bg-orange-100', 'text-orange-800');
                elFeedback.innerHTML = '<span>⏱ Vaqt tugadi!</span>';
            } else if (isCorrect) {
                elFeedback.classList.add('bg-green-100', 'text-green-800');
                let earnedPoints = questionScores[currentIndex];
                elFeedback.innerHTML = `<span>&#10004; Barakalla! To'g'ri javobni topdingiz. (+${earnedPoints} ⭐)</span>`;
            } else {
                elFeedback.classList.add('bg-red-100', 'text-red-800');
                elFeedback.innerHTML = `<span>&#10008; Afsuski, noto'g'ri.</span>`;
            }
        }

        function drawCertificate() {
            const canvas = document.getElementById('cert-canvas');
            const btnDownload = document.getElementById('btn-download-cert');
            canvas.classList.remove('hidden');
            
            // Kontekst va o'lcham
            const ctx = canvas.getContext('2d');
            canvas.width = 800;
            canvas.height = 600;
            
            // Fon
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Tashqi va ichki ramkalar
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 20;
            ctx.strokeRect(10, 10, 780, 580);
            
            ctx.strokeStyle = '#93c5fd';
            ctx.lineWidth = 5;
            ctx.strokeRect(35, 35, 730, 530);

            // Gulli naqsh (burchaklarga)
            ctx.fillStyle = '#bfdbfe';
            ctx.beginPath(); ctx.arc(35, 35, 30, 0, 2 * Math.PI); ctx.fill();
            ctx.beginPath(); ctx.arc(765, 35, 30, 0, 2 * Math.PI); ctx.fill();
            ctx.beginPath(); ctx.arc(35, 565, 30, 0, 2 * Math.PI); ctx.fill();
            ctx.beginPath(); ctx.arc(765, 565, 30, 0, 2 * Math.PI); ctx.fill();

            // Yozuvlar
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('SERTIFIKAT', canvas.width/2, 140);
            
            ctx.font = '24px Arial';
            ctx.fillStyle = '#475569';
            ctx.fillText('Ushbu sertifikat', canvas.width/2, 230);
            
            ctx.font = 'bold 36px Arial';
            ctx.fillStyle = '#1d4ed8';
            ctx.fillText('MATEMATIKA 2-SINF TESTLARI', canvas.width/2, 300);
            
            ctx.font = '24px Arial';
            ctx.fillStyle = '#475569';
            ctx.fillText('ni 100% (A\'lo) natija bilan muvaffaqiyatli', canvas.width/2, 370);
            ctx.fillText('yakunlagani uchun taqdim etiladi.', canvas.width/2, 410);
            
            // Sana 
            const today = new Date();
            const dateStr = `${today.getDate()}.${today.getMonth()+1}.${today.getFullYear()}`;
            ctx.font = 'italic 20px Arial';
            ctx.fillStyle = '#64748b';
            ctx.fillText('Sana: ' + dateStr, canvas.width/2, 500);

            // Yuklab olish tugmasini sozlash
            btnDownload.classList.remove('hidden');
            btnDownload.onclick = () => {
                const link = document.createElement('a');
                link.download = 'Matematika_Sertifikat.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
        }

        function showResult() {
            let correctCount = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === quizData[idx].correctIndex) correctCount++;
            });

            const percentage = Math.round((correctCount / quizData.length) * 100);

            screenQuiz.classList.add('hidden');
            screenResult.classList.remove('hidden');
            
            document.getElementById('result-stars').textContent = `${totalScore} ⭐`;
            document.getElementById('result-score').textContent = `${correctCount} / ${quizData.length}`;
            document.getElementById('result-percent').textContent = `${percentage}%`;
            
            // Avvalgi holatni tozalash
            document.getElementById('cert-canvas').classList.add('hidden');
            document.getElementById('btn-download-cert').classList.add('hidden');

            setTimeout(() => {
                document.getElementById('result-bar').style.width = `${percentage}%`;
            }, 100);

            const resultTitle = document.getElementById('result-title');
            const resultEmoji = document.getElementById('result-emoji');
            
            if (percentage === 100) {
                resultEmoji.textContent = '🏅';
                resultTitle.textContent = "Tabriklaymiz! Mutlaq G'alaba!";
                resultTitle.className = "text-3xl md:text-4xl font-bold text-green-600 mb-6";
                document.getElementById('result-score').classList.replace('text-blue-600', 'text-green-600');
                document.getElementById('result-bar').classList.replace('bg-blue-600', 'bg-green-600');
                
                // Sertifikatni chizish
                setTimeout(drawCertificate, 500);
            } else if (percentage >= 80) {
                resultEmoji.textContent = '🌟';
                resultTitle.textContent = "A'lo Natija!";
                resultTitle.className = "text-3xl font-bold text-green-600 mb-6";
                document.getElementById('result-score').classList.replace('text-blue-600', 'text-green-600');
                document.getElementById('result-bar').classList.replace('bg-blue-600', 'bg-green-600');
            } else if (percentage >= 60) {
                resultEmoji.textContent = '👍';
                resultTitle.textContent = "Yaxshi Natija!";
            } else {
                resultEmoji.textContent = '📚';
                resultTitle.textContent = "Ko'proq o'qish kerak";
                resultTitle.className = "text-3xl font-bold text-orange-500 mb-6";
                document.getElementById('result-score').classList.replace('text-blue-600', 'text-orange-500');
                document.getElementById('result-bar').classList.replace('bg-blue-600', 'bg-orange-500');
            }
            
            window.scrollTo(0, 0);
        }

        document.getElementById('btn-restart').addEventListener('click', () => {
            screenResult.classList.add('hidden');
            screenStart.classList.remove('hidden');
            
            document.getElementById('result-bar').style.width = '0%';
            document.getElementById('result-score').className = "text-3xl font-bold text-blue-600 mb-3";
            document.getElementById('result-bar').className = "bg-blue-600 h-3 rounded-full transition-all duration-1000 absolute left-0 top-0";
            document.getElementById('result-title').className = "text-3xl font-bold text-slate-800 mb-6";
            
            window.scrollTo(0, 0);
        });

    </script>
</body>
</html>
