                            "2/7 + 3/7 = 5/7 | 1 - 4/9 = 9/9 - 4/9 = 5/9"
                        ]
                    },
                    {
                        num: "15-17-boblar",
                        name: "Time, Picture Graphs with Scales & Volume (Vaqt, Masshtabli grafiklar va Hajm)",
                        topics: ["Soatni 5 daqiqa aniqlikda aytish, a.m. va p.m. tushunchasi", "Masshtabli piktogrammalar (masalan, 1 ta belgi = 5 ta o'quvchi)", "Suyuqlik hajmini litr (ℓ) da o'lchash va masalalar yechish"],
                        cpa: "Menzurka (o'lchov idishi)dagi suyuqlik sathini o'qish va hajmga oid Bar-modellar tuzish.",
                        modelTitle: "Masshtabli Piktogramma (Scale Picture Graph):",
                        modelHtml: `<div class="p-2.5 bg-amber-50 border border-amber-300 rounded text-xs">
                            <div>🌟 🌟 🌟 🌟 (Har bir 🌟 = 4 ta kitob)</div>
                            <div class="font-bold mt-1 text-amber-900">Jami kitoblar: 4 × 4 = 16 ta kitob</div>
                        </div>`,
                        examples: [
                            "School starts at 8:00 a.m. A math lesson lasts 1 hour. It ends at 9:00 a.m.",
                            "Tank A contains 24 ℓ of water. It contains 3 times as much water as Tank B. How much water is in Tank B? 24 ÷ 3 = 8 ℓ"
                        ]
                    }
                ]
            }
        };

        let currentBook = "1A";
        let currentChapterIndex = 0;

        function selectBook(bookKey) {
            currentBook = bookKey;
            currentChapterIndex = 0;

            ["1A", "1B", "2A", "2B"].forEach(k => {
                const btn = document.getElementById("tab-" + k);
                if (k === bookKey) {
                    btn.className = "px-4 py-2 rounded-lg text-sm font-bold bg-white text-sky-700 shadow";
                } else {
                    btn.className = "px-4 py-2 rounded-lg text-sm font-bold text-sky-100 hover:bg-sky-700/60";
                }
            });

            const book = booksData[bookKey];
            document.getElementById("sidebarTitle").innerText = `Maths ${bookKey} Mundarijasi`;
            document.getElementById("isbnBadge").innerText = book.isbn;

            // Update quick HTML5 reader links
            const q = encodeURIComponent(`"My Pals Are Here" "Maths ${bookKey}"`);
            document.getElementById("externalLinks").innerHTML = `
                <a href="https://www.scribd.com/search?query=My+Pals+Are+Here+Maths+${bookKey}" target="_blank" class="text-center text-xs bg-white border border-amber-300 hover:bg-amber-100 text-amber-900 py-1.5 px-2 rounded font-semibold">📄 Scribd HTML (${bookKey})</a>
                <a href="https://archive.org/search?query=My+Pals+Are+Here+Maths+${bookKey}" target="_blank" class="text-center text-xs bg-white border border-amber-300 hover:bg-amber-100 text-amber-900 py-1.5 px-2 rounded font-semibold">🏛️ Archive Reader (${bookKey})</a>
                <a href="https://www.google.com/search?q=site:anyflip.com+${q}" target="_blank" class="text-center text-xs bg-white border border-amber-300 hover:bg-amber-100 text-amber-900 py-1.5 px-2 rounded font-semibold">📖 AnyFlip HTML5 (${bookKey})</a>
                <a href="https://www.google.com/search?q=site:fliphtml5.com+${q}" target="_blank" class="text-center text-xs bg-white border border-amber-300 hover:bg-amber-100 text-amber-900 py-1.5 px-2 rounded font-semibold">📘 FlipHTML5 (${bookKey})</a>
            `;

            renderChapterList();
            renderLesson(0);
        }

        function renderChapterList() {
            const listEl = document.getElementById("chapterList");
            const chapters = booksData[currentBook].chapters;
            listEl.innerHTML = chapters.map((ch, idx) => `
                <button onclick="renderLesson(${idx})" class="w-full text-left p-3 rounded-xl border transition flex flex-col gap-0.5 ${idx === currentChapterIndex ? 'bg-sky-50 border-sky-400 text-sky-900 font-semibold' : 'bg-white border-slate-200 hover:bg-slate-50 text-slate-700'}">
                    <span class="text-[11px] uppercase tracking-wider text-sky-600 font-bold">${ch.num}</span>
                    <span class="text-sm">${ch.name}</span>
                </button>
            `).join("");
        }

        function renderLesson(idx) {
            currentChapterIndex = idx;
            renderChapterList();
            const ch = booksData[currentBook].chapters[idx];
            const contentEl = document.getElementById("lessonContent");

            contentEl.innerHTML = `
                <div class="border-b pb-4 mb-5">
                    <span class="px-2.5 py-1 bg-sky-100 text-sky-800 rounded-md text-xs font-bold uppercase">${booksData[currentBook].title} • ${ch.num}</span>
                    <h2 class="text-2xl font-bold text-slate-900 mt-2">${ch.name}</h2>
                </div>

                <div class="space-y-6">
                    <div>
                        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2">📌 Asosiy mavzular (HTML matn):</h3>
                        <ul class="list-disc list-inside space-y-1.5 text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-200">
                            ${ch.topics.map(t => `<li>${t}</li>`).join("")}
                        </ul>
                    </div>

                    <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl">
                        <h3 class="text-sm font-bold text-emerald-900 mb-1">🧠 Singapur CPA (Concrete-Pictorial-Abstract) Yondashuvi:</h3>
                        <p class="text-sm text-emerald-800">${ch.cpa}</p>
                    </div>

                    <div>
                        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2">📊 ${ch.modelTitle}</h3>
                        <div class="p-4 bg-white border border-slate-200 rounded-xl shadow-inner">
                            ${ch.modelHtml}
                        </div>
                    </div>

                    <div>
                        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2">✏️ Kitobdagi namunaviy topshiriq va masalalar (Inglizcha/O'zbekcha):</h3>
                        <div class="space-y-2">
                            ${ch.examples.map((ex, i) => `
                                <div class="p-3 bg-slate-50 border-l-4 border-sky-500 rounded-r-lg text-sm font-medium text-slate-800">
                                    <span class="text-sky-600 font-bold mr-1">#${i + 1}.</span> ${ex}
                                </div>
                            `).join("")}
                        </div>
                    </div>
                </div>
            `;
        }

        function loadLocalPdf(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                document.getElementById("bookFrame").src = url;
                document.getElementById("pdfViewerBox").classList.remove("hidden");
            }
        }

        function closeViewer() {
            document.getElementById("pdfViewerBox").classList.add("hidden");
            document.getElementById("bookFrame").src = "";
        }

        // Initialize with 1A
        selectBook("1A");
    </script>
</body>
</html>
